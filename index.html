 const rows=schools.map(school=>{
  const detailed=classesBySchool[school.id]||[],declaredClasses=summaryPlanNumber(school.class_count);
  const totalClasses=Math.max(declaredClasses,detailed.length),missingDetailed=Math.max(totalClasses-detailed.length,0),fallbackPeriods=school.stage==='إعدادي'?PREPARATORY_SCIENCE_PERIODS_PER_CLASS:0;
  const requirementFromDetails=detailed.reduce((sum,row)=>sum+planClassPeriods(row),0);
  const requiredPeriods=requirementFromDetails+(missingDetailed*fallbackPeriods);
  const defaultPeriodClasses=detailed.filter(row=>(row.class_subject_requirements||[]).reduce((sum,item)=>sum+summaryPlanNumber(item.weekly_periods),0)===0&&summaryPlanNumber(row.science_periods)===0).length;
  const gradeCount=grade=>detailed.filter(row=>normalizePlanGrade(row.grade)===grade).length;
  const schoolTeachers=teachersBySchool[school.id]||[];
  const permanent=schoolTeachers.filter(t=>String(t.work_type||'permanent')!=='paid'),paid=schoolTeachers.filter(t=>String(t.work_type||'')==='paid');
  const targetDetails=permanent.map(teacher=>{
   const target=teacher.weekly_target==null?planRuleTarget(teacher,school.stage,rules):summaryPlanNumber(teacher.weekly_target);
   const relation=String(teacher.school_relation||'home');
   const localTeaching=summaryPlanNumber(teacher.teaching_periods);
   const globalTeaching=summaryPlanNumber(teacher.global_teaching_periods??teacher.teaching_periods);
   const globalSupervision=summaryPlanNumber(teacher.global_supervision_periods??teacher.supervision_periods);
   const personalDuties=globalSupervision;
   const legalAvailable=target==null?0:planTeacherTeachingCapacity(target,personalDuties,school.stage);
   let available=legalAvailable;
   if(relation==='delegated_in_partial')available=localTeaching;
   else if(relation==='delegated_out_partial'){
    const externalTeaching=Math.max(globalTeaching-localTeaching,0);
    available=Math.max(localTeaching,planNearestWholeClassLoad(Math.max(legalAvailable-externalTeaching,0),school.stage));
   }
   return {teacher,target,relation,localTeaching,globalTeaching,globalSupervision,personalDuties,legalAvailable,available};
  });
  const missingTargets=targetDetails.filter(item=>item.target==null).length;
  const basicNormTotal=targetDetails.reduce((sum,item)=>sum+summaryPlanNumber(item.target),0);
  const supervisionPeriods=permanent.reduce((sum,t)=>sum+summaryPlanNumber(t.supervision_periods),0);
  const planningCapacity=targetDetails.reduce((sum,item)=>sum+item.available,0);
  const basicCapacity=targetDetails.reduce((sum,item)=>sum+item.localTeaching,0);
  const paidAssigned=summaryPlanNumber(paidAssignedBySchool[school.id]);
  const calculationReady=totalClasses>0&&(school.stage==='إعدادي'||(missingDetailed===0&&detailed.every(c=>planClassPeriods(c)>0))),paidRequired=calculationReady?Math.max(requiredPeriods-basicCapacity,0):null;
  const remainingDeficit=calculationReady?paidRequired:null,surplus=calculationReady?Math.max(basicCapacity-requiredPeriods,0):null;
  const classSource=detailed.length===0?'school_total':missingDetailed>0?'mixed':'detailed';
  const homePermanent=permanent.filter(t=>['home','delegated_out_partial'].includes(String(t.school_relation||'home'))).length;
  const partialDelegates=permanent.filter(t=>String(t.school_relation||'').includes('partial')).length;
  const incomingPartial=permanent.filter(t=>String(t.school_relation||'')==='delegated_in_partial').length;
  const fullDelegates=permanent.filter(t=>String(t.school_relation||'')==='delegated_in_full').length;
  const delegatedCoverage=targetDetails.filter(x=>x.relation==='delegated_in_partial').reduce((n,x)=>n+x.available,0);
  const notes=[];
  if(!calculationReady)notes.push('عدد الفصول أو حصص المواد غير مكتمل؛ لا يمكن تحديد العجز');
  else if(classSource==='school_total')notes.push('إجمالي المدرسة × 4');
  else if(classSource==='mixed')notes.push(`${detailed.length} فصل مفصل + ${missingDetailed} غير مفصل × 4`);
  if(defaultPeriodClasses)notes.push(`${defaultPeriodClasses} فصل محسوب × 4 لعدم تحديد حصص مواده`);
  if(!permanent.length&&calculationReady)notes.push('بدون معلم أساسي أو منتدب');
  if(missingTargets)notes.push(`${missingTargets} معلم بلا نصاب معتمد`);
  if(incomingPartial)notes.push(`تغطية الانتداب الجزئي الفعلية: ${delegatedCoverage} حصة؛ الإشراف في المدرسة الأصلية فقط`);
  if(paid.length&&!paidAssigned)notes.push(`${paid.length} معلم أجر بلا حصص مسندة`);
  return {
   school_id:school.id,school_name:school.name,school_stage:school.stage,planning_capacity:planningCapacity,grade1_classes:gradeCount('الأول'),grade2_classes:gradeCount('الثاني'),grade3_classes:gradeCount('الثالث'),
   total_classes:totalClasses,required_periods:requiredPeriods,roster_teachers:schoolTeachers.length,permanent_teachers:permanent.length,home_permanent_teachers:homePermanent,
   partial_delegates:partialDelegates,incoming_partial_delegates:incomingPartial,full_delegates:fullDelegates,delegated_coverage:delegatedCoverage,
   basic_norm_total:basicNormTotal,internal_duties:supervisionPeriods,supervision_periods:supervisionPeriods,personal_duties:supervisionPeriods,basic_capacity:basicCapacity,actual_teaching:basicCapacity,
   paid_teachers:paid.length,paid_required:paidRequired,paid_assigned:paidAssigned,remaining_deficit:remainingDeficit,surplus,class_source:classSource,calculation_ready:calculationReady,
   teacher_capacity_details:targetDetails,notes:notes.join('؛ ')
  };
 }).sort((a,b)=>String(a.school_name||'').localeCompare(String(b.school_name||''),'ar'));
 rows.forEach((row,index)=>row.source_row_no=index+1);
 const ready=rows.filter(row=>row.calculation_ready),sum=field=>ready.reduce((total,row)=>total+summaryPlanNumber(row[field]),0);
 const unique=v91UniqueByTeacher(allTeacherRows),uniquePermanent=v91UniqueByTeacher(allTeacherRows.filter(t=>String(t.work_type||'permanent')!=='paid'));
 const partialIds=new Set(allTeacherRows.filter(t=>String(t.school_relation||'').includes('partial')).map(v91TeacherId));
 return {rows,stats:{
  visibleSchools:rows.length,completeSchools:ready.length,incompleteSchools:rows.length-ready.length,detailedSchools:ready.filter(row=>row.class_source==='detailed').length,
  totalClasses:sum('total_classes'),requiredPeriods:sum('required_periods'),uniqueTeachers:unique.length,schoolMemberships:sum('roster_teachers'),permanentTeachers:uniquePermanent.length,
  partialDelegations:partialIds.size,basicCapacity:sum('basic_capacity'),paidRequired:sum('paid_required'),paidAssigned:sum('paid_assigned'),remainingDeficit:sum('remaining_deficit'),surplus:sum('surplus'),
  grade1:sum('grade1_classes'),grade2:sum('grade2_classes'),grade3:sum('grade3_classes'),gradeTotalsAvailable:ready.length>0&&ready.every(row=>row.class_source==='detailed'),
  periodLabel:input.periodLabel||[activeYear?.label,activeTerm?.name].filter(Boolean).join(' — ')||'الفترة الحالية'
 }};
};

/* v119: تجميع الفصول حسب الصف (عدد الفصول × حصص الفصل) في صفحة الفصول وتقرير الفصول بدل تكرار كل فصل. */
function v119ClassPeriods(c){const reqs=c.class_subject_requirements||[];const sum=reqs.reduce((n,r)=>n+Number(r.weekly_periods||0),0);return sum||Number(c.science_periods||0)}
function v119ClassSubjects(c){const reqs=(c.class_subject_requirements||[]).slice().sort((a,b)=>(a.curriculum_subjects?.sort_order||0)-(b.curriculum_subjects?.sort_order||0));return reqs.length?reqs.map(r=>`${r.curriculum_subjects?.subject_name||'علوم'} (${Number(r.weekly_periods||0)})`).join('، '):`علوم (${Number(c.science_periods||0)})`}
function v119GroupClasses(classes){
 const map=new Map();
 (classes||[]).forEach(c=>{const key=[c.school_id||'',c.stage||'',c.grade||''].join('|');if(!map.has(key))map.set(key,{school_id:c.school_id,school:c.schools?.name||'',stage:c.stage||'',grade:c.grade||'',order:Number(c.grade_order||0),items:[]});map.get(key).items.push(c)});
 return [...map.values()].map(g=>{const per=[...new Set(g.items.map(v119ClassPeriods))],subj=[...new Set(g.items.map(v119ClassSubjects))];return {...g,count:g.items.length,perClass:per.length===1?per[0]:null,subjects:subj.length===1?subj[0]:'مختلفة بين الفصول',total:g.items.reduce((n,c)=>n+v119ClassPeriods(c),0)}})
  .sort((a,b)=>String(a.school).localeCompare(String(b.school),'ar')||a.order-b.order||String(a.grade).localeCompare(String(b.grade),'ar'));
}

}

 const columns=[...(single?[]:[reportColumn('school','المدرسة',1.8)]),reportColumn('stage','المرحلة',.8),reportColumn('grade','الصف',1),reportColumn('count','عدد الفصول',.8,{numeric:true}),reportColumn('subjects','المواد / حصص الفصل',2),reportColumn('periods','إجمالي الحصص',.9,{numeric:true})];

 return v103BaseReport('schoolTeachersData',ctx,[reportColumn('index','م',.3,{numeric:true}),reportColumn('name','المعلم',1.6),reportColumn('civil','الرقم المدني',1.1,{id:true,nowrap:true}),reportColumn('phone','الهاتف',.95,{id:true,nowrap:true}),reportColumn('job','الدرجة',.8),reportColumn('workType','نوع التعاقد',.6),reportColumn('specialty','التخصص',.8),reportColumn('qualification','المؤهل',1.1),reportColumn('code','الكود',.5),reportColumn('residence','محل الإقامة',.9),reportColumn('appointment','التعيين',.75,{nowrap:true}),...(single?[]:[reportColumn('school','المدرسة',1.3)])],rows,'البيانات كما هي مسجلة في قاعدة البيانات للمعلمين على قوة المدرسة والمنتدبين إليها.');

/* v124: لوحة مشرف المادة/مدير المدرسة: «ماذا ينقص مدرستي الآن؟» + نصاب المعلمين في شاشة واحدة. قراءة فقط. */
function v124Kpi(label,value,tone=''){return `<div class="v124-kpi ${tone}"><small>${esc(label)}</small><b>${esc(String(value))}</b></div>`}
function v124OpenTimetable(id){v101TeacherId=String(id||'');go('teacherTimetable')}
async function v124SchoolBoard(force){
 const school=await mySchool();if(!school||!activeTerm?.id)return '';
 const data=await v91LoadReportsDataset({force});
 const scopes=v103ScopeRows(data).filter(s=>String(v91ScopeSchoolId(s))===String(school.id));
 const seen=new Set(),teachers=scopes.filter(s=>{const k=v91TeacherId(s);if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>String(a.full_name).localeCompare(String(b.full_name),'ar'));
 const classes=(data.classes||[]).filter(c=>String(c.school_id)===String(school.id));
 const classIds=new Set(classes.map(c=>String(c.id)));
 const assigns=(data.assignments||[]).filter(a=>classIds.has(String(a.class_id)));
 const plan=buildOperationalSchoolPlanData({schools:(data.hierarchy?.schools||[]).filter(s=>String(s.id)===String(school.id)),classes,teachers:data.teacher_records||[],schoolTeacherRosters:scopes,rules:data.rules||[],assignments:assigns});
 const p=plan.rows?.[0]||{};
 const required=reportNumber(p.required_periods),assigned=assigns.reduce((n,a)=>n+reportNumber(a.weekly_periods),0);
 const ready=p.calculation_ready!==false,deficit=ready?reportNumber(p.remaining_deficit):null,surplus=reportNumber(p.surplus);
 const alerts=[];
 // فصول غير مسندة
 const assignedPer=new Map();assigns.forEach(a=>assignedPer.set(String(a.class_id),(assignedPer.get(String(a.class_id))||0)+reportNumber(a.weekly_periods)));
 const unassigned=classes.filter(c=>(assignedPer.get(String(c.id))||0)<v119ClassPeriods(c));
 if(unassigned.length){const g=v119GroupClasses(unassigned).map(x=>`${gradeLabel(x.stage,x.grade)}: ${x.count}`).join('، ');alerts.push({tone:'danger',text:`${unassigned.length} فصل غير مسند بالكامل (${g})`,action:`go('assignments')`,btn:'التوزيع'})}
 // الجداول غير المكتملة
 try{const ws=await sb.rpc('get_teacher_timetable_workspace',{p_school_id:school.id,p_term_id:activeTerm.id});if(!ws.error&&ws.data){const w=ws.data,need=new Map(),done=new Map();(w.assignments||[]).forEach(a=>need.set(String(a.teacher_id),(need.get(String(a.teacher_id))||0)+reportNumber(a.weekly_periods)));(w.slots||[]).forEach(s=>done.set(String(s.teacher_id),(done.get(String(s.teacher_id))||0)+1));
  const configured=Number(w.config?.revision||0)>0;
  if(!configured)alerts.push({tone:'warn',text:'إعدادات أيام الدراسة وعدد الحصص في المدرسة لم تُحفظ بعد',action:`go('teacherTimetable')`,btn:'الجدول'});
  (w.teachers||[]).forEach(t=>{const id=String(t.teacher_id||t.id),n=need.get(id)||0,d=done.get(id)||0;if(n>0&&d<n)alerts.push({tone:'warn',text:`جدول ${t.full_name} غير مكتمل: ${d} / ${n}`,action:`v124OpenTimetable('${esc(id)}')`,btn:'الجدول'})});}}catch(_){}
 // بيانات ناقصة
 try{const ids=teachers.map(v91TeacherId).filter(Boolean);if(ids.length){const r=await sb.from('teacher_records').select('id,full_name,phone,qualification,qualification_year,source_reference,appointment_date,work_type,home_school_id').in('id',ids);
  (r.data||[]).filter(t=>String(t.home_school_id)===String(school.id)).forEach(t=>{const miss=[];if(!v123Qualification(t))miss.push('المؤهل');if(t.work_type!=='paid'&&!t.appointment_date)miss.push('تاريخ التعيين');if(miss.length)alerts.push({tone:'info',text:`${t.full_name}: ينقص ${miss.join('، ')}`,action:`editTeacherForm('${esc(t.id)}')`,btn:'تعديل'})});}}catch(_){}
 // حالة الاعتماد
 try{const r=await sb.from('school_submissions').select('status,return_reason').eq('term_id',activeTerm.id).eq('school_id',school.id).maybeSingle();if(r.data?.status==='returned_for_edit')alerts.unshift({tone:'danger',text:`ملف المدرسة معاد للتعديل${r.data.return_reason?': '+r.data.return_reason:''}`,action:`go('approval')`,btn:'الاعتماد'})}catch(_){}
 const kpis=[v124Kpi('الفصول',classes.length),v124Kpi('الحصص المطلوبة',required),v124Kpi('الحصص المسندة',assigned),ready?(deficit>0?v124Kpi('العجز',deficit,'danger'):surplus>0?v124Kpi('الزيادة',surplus,'ok'):v124Kpi('العجز',0,'ok')):v124Kpi('العجز','غير مكتمل','warn')].join('');
 const alertHtml=alerts.length?alerts.map(a=>`<div class="v124-alert ${a.tone}"><span>${esc(a.text)}</span><button type="button" class="btn secondary v118-edit-btn" onclick="${a.action}">${a.btn}</button></div>`).join(''):'<div class="notice ok">لا توجد نواقص حالية في مدرستك.</div>';
 const rows=teachers.map(t=>`<tr><td><b>${esc(t.full_name)}</b>${String(t.school_relation||'').startsWith('delegated_in_')?'<div class="cell-sub">منتدب للمدرسة</div>':''}</td><td>${isPaidTeacher(t)?'بالأجر':'ثابت'}</td><td>${esc(workloadTargetLabel(t))}</td><td>${reportNumber(t.teaching_periods)}</td><td>${reportNumber(t.supervision_periods)}</td><td><b>${reportNumber(t.total_counted_periods)}</b></td><td>${workloadStatusBadge(t)}</td></tr>`).join('');
 return `<div class="v124-board"><div class="card"><div class="card-title"><div><h3>${esc(school.name)} — ماذا ينقص مدرستي الآن؟</h3><p class="muted">${esc(activeTerm?.name||'')}</p></div><button type="button" class="btn secondary v118-edit-btn" onclick="loadPage(true)">تحديث</button></div><div class="v124-kpis">${kpis}</div><div class="v124-alerts">${alertHtml}</div></div>
 <div class="card"><div class="card-title"><h3>نصاب المعلمين</h3><span class="badge info">${teachers.length} معلم</span></div><div class="table-wrap v118-plain-wrap"><table class="table no-compact-directory v118-plain-table v124-load-table"><thead><tr><th>المعلم</th><th>النوع</th><th>النصاب</th><th>تدريس</th><th>إشراف</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody>${rows||'<tr><td colspan="7">لا يوجد معلمون.</td></tr>'}</tbody></table></div></div></div>`;
}
