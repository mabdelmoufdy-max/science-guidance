<!-- v127: حذف الريادة من الواجهة بالكامل (حقل رائد الفصل وأعمدتها وحساباتها وتقاريرها). -->
<!-- v126: حصتا الإشراف تدخلان في إجمالي نصاب المعلم ولا تُحتسبان زيادة ولا تُخصمان من حصص المدرسة -->
<!-- v125: البيانات التكميلية (الهاتف، العنوان، مدير المدرسة) لا تُحسب نواقص ولا تظهر في التنبيهات؛ معلم الأجر لا تُطلب له درجة وظيفية ولا تاريخ تعيين. -->
<!-- v124 تجربة: لوحة مشرف المادة/مدير المدرسة: مؤشرات المدرسة وتنبيهات النواقص القابلة للضغط وجدول نصاب المعلمين؛ مصدر النسخة v123. -->
<!-- v123 تجربة: عرض المؤهل من مصدر البيانات المرفوع عند خلو عمود المؤهل (معلمو الإعدادي) في تقرير بيانات المعلمين ونموذج التعديل؛ مصدر النسخة v122. -->
<!-- v122 تجربة: تقرير الانتداب يعرض المدرسة الأخرى وحصص المعلم فيها حتى لو كانت خارج نطاق الموجه (عبر get_delegation_periods)؛ مصدر النسخة v121. -->
<!-- v121 تجربة: تقرير بيانات المعلمين يعمل بفلاتر المرحلة والموجه والمدرسة للموجه فما فوق؛ تقرير الانتداب يعرض حصص المعلم بالمدرسة الأصلية والمنتدب إليها ويظهر من الموجه فما فوق؛ مصدر النسخة v120. -->
<!-- v120 تجربة: تقرير «بيانات معلمي المدرسة» بكل بيانات المعلم وزر تعديل لكل معلم وطباعة A4؛ مصدر النسخة v119. -->
<!-- v119 تجربة: تجميع الفصول حسب الصف (عدد الفصول وحصص الفصل والإجمالي) في صفحة الفصول وتقرير الفصول؛ مصدر النسخة v118. -->
<!-- v118 تجربة: عرض الفصول والإسنادات الحالية كجدول مضغوط (سطر لكل بيان) مع زر تعديل؛ مصدر النسخة v117. -->
<!-- v117 تجربة: عرض نتائج التقارير والإحصائيات داخل الصفحة مع زر «عرض النتائج» وتنبيه عند خلو النتائج بسبب الفلاتر؛ مصدر النسخة v116. -->
<!-- v116 تجربة: تحسين شاشة جدول المعلم على الهاتف (أعمدة أضيق، تسمية مختصرة للفصل، الخانات المسجلة ملونة، تلميح السحب)؛ مصدر النسخة v115. -->
<!-- v115 تجربة: مشرف المادة/مدير المدرسة: إخفاء فلاتر المرحلة والمدرسة والموجه، وإخفاء تقارير الإدارة غير المنطبقة على مدرسة واحدة، وتصحيح موضع شريط الأزرار على الهاتف؛ مصدر النسخة v114. -->
<!-- v114 تجربة: تصحيح الرقمين المدنيين في القاعدة، وحفظ الحقول الجديدة من نموذج تعديل المعلم، وإصلاح حفظ التعديل (الدالة v96 غير موجودة)؛ مصدر النسخة v113. -->
<!-- v113 تجربة: عرض حقول بيانات المعلم الجديدة (التخصص، المؤهل وسنته، الكود، محل الإقامة) في شاشة المعلمين ونموذج التعديل (عرض فقط) وبيانات المعلم بتقرير المدرسة؛ مصدر النسخة v112. -->
<!-- v112: تقرير المدرسة الشامل مجمّع بالمعلم — كل معلم يظهر اسمه مرة واحدة وتحته بياناته ونصابه كما ورد وفصوله المسندة وجدول حصصه؛ مصدر النسخة v111. -->
<!-- v102: طباعة الجدول الفردي للمعلم، وطباعة المعلم المحدد أو جميع معلمي المدرسة للمشرف والأدوار الأعلى. -->
<!-- v101: جدول المعلم الأسبوعي؛ إدخال من مشرف المادة فأعلى، وعرض للمعلم. -->
<!-- تجربة v100: معلم الأجر بلا حد أدنى أو أعلى؛ حصص مسندة فقط، مع السماح بالانتداب. -->
<!-- تجربة v99: توحيد تنسيق المعاينة والطباعة وإظهار نطاق التقرير والفلاتر على كل صفحة. اختبار المتصفح متعدد الصفحات لم يكتمل في بيئة التنفيذ. -->
<!-- المصدر المعتمد 2026.10.06.95: إضافة عرض ميزانيتي الثانوي العام والصناعي للبيانات المدخلة؛ مصدر النسخة v93. -->
<!-- الإصدار 2026.09.07.93: تمكين مشرف المادة من تعديل إسناد الحصص داخل مدرسته مع تحقق ذري وسجل مراجعة -->
<!-- الإصدار 2026.09.06.92: ترتيب بطاقات الإحصاءات الختامية في صف واحد على الهاتف -->
<!-- الإصدار 2026.09.06.91: معالجة مركزية شاملة للانتداب في التقارير والإحصائيات والحصص والإشراف -->
<!-- الإصدار 2026.09.06.88: إظهار مدرسة المصدر في خانة المدرسة فقط -->
<!-- الإصدار 2026.09.06.78: إصلاح زر إضافة فصل واستجابة فورية مع إبقاء الحفظ والاعتماد الآمن -->

/* === تنسيق الطباعة الموحد للتقارير === */
@media print {
  @page {
    size: A4 landscape;
    margin: 10mm;
  }

  html, body {
    direction: rtl !important;
    text-align: right !important;
    font-size: 16px !important;
    line-height: 1.5 !important;
    background: #fff !important;
    color: #000 !important;
  }

  body, table, th, td, p, div, span, h1, h2, h3, h4 {
    direction: rtl !important;
  }

  #sidebar,
  .sidebar,
  .topbar,
  .page-head .actions,
  .btn,
  button,
  .no-print {
    display: none !important;
  }

  #main,
  .main,
  #content,
  .content {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .card,
  .table-wrap {
    width: 100% !important;
    max-width: none !important;
    overflow: visible !important;
    box-shadow: none !important;
    border: 0 !important;
    break-inside: avoid;
  }

  .table-wrap {
    margin-bottom: 12px !important;
  }

  table,
  .table {
    width: 100% !important;
    table-layout: auto !important;
    border-collapse: collapse !important;
    font-size: 16px !important;
  }

  th, td {
    font-size: 16px !important;
    padding: 7px 8px !important;
    white-space: normal !important;
    word-break: normal !important;
    overflow-wrap: anywhere !important;
    vertical-align: top !important;
    text-align: right !important;
  }

  th {
    font-weight: 700 !important;
  }

  thead {
    display: table-header-group !important;
  }

  tr {
    break-inside: avoid !important;
    page-break-inside: avoid !important;
  }

  h1, h2, h3 {
    direction: rtl !important;
    text-align: right !important;
    break-after: avoid !important;
  }

  h2 { font-size: 22px !important; }
  h3 { font-size: 18px !important; }

  .grid4,
  .stats {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
  }

  .stat-card {
    min-width: 22% !important;
    flex: 1 1 22% !important;
  }

  details {
    display: block !important;
  }
  details > * {
    display: block !important;
  }
  details summary {
    font-weight: 700 !important;
  }

  .badge {
    font-size: 15px !important;
    white-space: nowrap !important;
  }

  .notice,
  .cell-sub,
  .stat-label,
  .stat-foot {
    font-size: 16px !important;
  }

  a[href]:after {
    content: none !important;
  }
}

/* === تعميم أسلوب القوائم المختصرة على بقية صفحات البيانات === */
/* شريط التصفية ثابت في سطرين: البحث أولًا، وكل عوامل التصفية في السطر الثاني. */
.auto-filter-bar{
  display:block !important;
  width:100% !important;
  max-width:100% !important;
  overflow:hidden !important;
}
.auto-filter-search-row{
  display:block !important;
  width:100% !important;
  margin:0 0 6px !important;
}
.auto-filter-search-row .auto-filter-field.search,
.auto-filter-search-row input{
  width:100% !important;
  min-width:0 !important;
  max-width:none !important;
}
.auto-filter-options-row{
  display:flex !important;
  flex-flow:row nowrap !important;
  align-items:stretch !important;
  gap:6px !important;
  width:100% !important;
  max-width:100% !important;
  overflow-x:auto !important;
  overflow-y:hidden !important;
  padding:0 0 2px !important;
  scrollbar-width:thin;
  overscroll-behavior-inline:contain;
  -webkit-overflow-scrolling:touch;
}
.auto-filter-options-row > .auto-filter-field{
  flex:1 0 125px !important;
  width:auto !important;
  min-width:112px !important;
  max-width:none !important;
}
.auto-filter-options-row > .auto-filter-reset{
  flex:0 0 70px !important;
  width:70px !important;
  min-width:70px !important;
}
.auto-filter-options-row > .auto-filter-count{
  flex:0 0 68px !important;
  width:68px !important;
  min-width:68px !important;
  display:grid !important;
  place-items:center;
}

.compact-directory-wrap{
  width:100%;
  max-width:100%;
  overflow:visible !important;
  border:0 !important;
}
.compact-mode-hint{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  margin:0 0 9px;
  padding:8px 10px;
  border:1px solid #c8d6e3;
  border-radius:10px;
  background:#eef5fa;
  color:var(--primary-dark);
  font-size:11px;
  font-weight:800;
  line-height:1.55;
}
.compact-mode-hint::before{
  content:'✓';
  display:grid;
  place-items:center;
  flex:0 0 22px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  font-size:12px;
}
.compact-mode-error{
  border-color:#d8b6b6;
  background:#fff7f7;
  color:var(--danger);
}
.compact-mode-error::before{content:'!';background:var(--danger)}
table.compact-directory-table{
  display:block;
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
  border:0;
  background:transparent;
}
table.compact-directory-table thead{
  position:absolute !important;
  width:1px !important;
  height:1px !important;
  padding:0 !important;
  margin:-1px !important;
  overflow:hidden !important;
  clip:rect(0,0,0,0) !important;
  clip-path:inset(50%) !important;
  white-space:nowrap !important;
  border:0 !important;
}
table.compact-directory-table tbody{
  display:grid !important;
  width:100%;
  gap:8px;
}
table.compact-directory-table tbody tr.compact-directory-record{
  display:grid !important;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0 8px;
  width:100%;
  padding:0 !important;
  border:1px solid var(--line) !important;
  border-radius:13px !important;
  background:var(--card) !important;
  box-shadow:0 3px 10px rgba(21,44,67,.05) !important;
  overflow:hidden;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
table.compact-directory-table tbody tr.compact-directory-record[style*="display: none"]{
  display:none !important;
}
table.compact-directory-table tbody tr.compact-directory-record.compact-record-open{
  border-color:var(--primary) !important;
  background:#fbfdff !important;
  box-shadow:0 6px 16px rgba(31,79,120,.11) !important;
}
table.compact-directory-table td.compact-record-summary-cell{
  display:block !important;
  grid-column:1/-1;
  width:100% !important;
  min-width:0 !important;
  padding:0 !important;
  border:0 !important;
  background:transparent !important;
}
table.compact-directory-table td.compact-record-summary-cell::before{display:none !important}
.compact-record-summary-shell{
  display:flex;
  align-items:center;
  gap:6px;
  width:100%;
  min-width:0;
}
.compact-record-summary-shell .compact-record-toggle{
  flex:1 1 auto;
  min-width:0;
}
.compact-record-direct-action{
  flex:0 0 auto;
  min-height:38px !important;
  padding:7px 11px !important;
  margin-inline-end:8px;
  border-radius:10px !important;
  font-size:11px !important;
  white-space:nowrap;
}
.compact-record-toggle{
  appearance:none;
  display:grid;
  grid-template-columns:minmax(150px,1.25fr) minmax(0,2fr) 28px;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:58px;
  border:0;
  background:transparent;
  color:var(--ink);
  padding:10px 12px;
  text-align:right;
  cursor:pointer;
}
.compact-record-toggle:hover,
.compact-record-toggle:focus-visible{
  outline:none;
  background:#f1f6fa;
}
.compact-record-primary{
  min-width:0;
  overflow:hidden;
}
.compact-record-primary b{
  display:block;
  min-width:0;
  overflow:hidden;
  color:var(--primary-dark);
  font-size:14px;
  font-weight:900;
  line-height:1.45;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.compact-record-primary small{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  line-height:1.4;
}
.compact-record-meta{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
  overflow:hidden;
}
.compact-record-meta-item{
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
  max-width:100%;
  border:1px solid var(--line-soft);
  border-radius:999px;
  background:var(--head);
  color:var(--primary-dark);
  padding:5px 8px;
  font-size:10px;
  line-height:1.3;
  white-space:nowrap;
}
.compact-record-meta-item em{
  color:var(--muted);
  font-size:9px;
  font-style:normal;
  font-weight:700;
}
.compact-record-meta-item span{
  min-width:0;
  overflow:hidden;
  font-weight:900;
  text-overflow:ellipsis;
}
.compact-record-arrow{
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--head);
  color:var(--primary-dark);
  font-size:18px;
  font-weight:900;
  transition:transform .15s ease,background .15s ease;
}
.compact-record-open .compact-record-arrow{
  transform:rotate(180deg);
  background:var(--primary);
  color:#fff;
}
table.compact-directory-table tbody tr.compact-directory-record > td:not(.compact-record-summary-cell){
  display:none !important;
}
table.compact-directory-table tbody tr.compact-directory-record.compact-record-open > td:not(.compact-record-summary-cell){
  display:grid !important;
  grid-template-columns:1fr;
  align-content:start;
  gap:4px;
  min-width:0;
  width:auto !important;
  margin:0;
  padding:10px !important;
  border:1px solid var(--line-soft) !important;
  border-radius:10px;
  background:#f8fafc;
  text-align:right;
  overflow-wrap:anywhere;
}
table.compact-directory-table tbody tr.compact-directory-record.compact-record-open > td:not(.compact-record-summary-cell)::before{
  content:attr(data-label);
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  line-height:1.45;
}
table.compact-directory-table tbody tr.compact-directory-record.compact-record-open > td:not(.compact-record-summary-cell) .mobile-cell-value{
  display:block;
  min-width:0;
  color:var(--ink);
  font-size:12px;
  line-height:1.65;
}
table.compact-directory-table tbody tr.compact-directory-record.compact-record-open > td:not(.compact-record-summary-cell) .actions{
  display:flex;
  flex-wrap:wrap;
  width:100%;
}
table.compact-directory-table tbody tr.compact-directory-record.compact-record-open > td:not(.compact-record-summary-cell) .btn,
table.compact-directory-table tbody tr.compact-directory-record.compact-record-open > td:not(.compact-record-summary-cell) select,
table.compact-directory-table tbody tr.compact-directory-record.compact-record-open > td:not(.compact-record-summary-cell) input{
  min-height:38px;
  max-width:100%;
}
table.compact-directory-table tbody tr.compact-directory-empty-row{
  display:block !important;
  width:100%;
}
table.compact-directory-table tbody tr.compact-directory-empty-row > td{
  display:block !important;
  width:100% !important;
  padding:20px 12px !important;
  border:1px dashed var(--line) !important;
  border-radius:12px;
  background:var(--card);
  color:var(--muted);
  text-align:center;
}

  }

  table.compact-directory-table tbody tr.compact-directory-record > td:not(.compact-record-summary-cell),

  table.compact-directory-table tbody tr.compact-directory-record > td:not(.compact-record-summary-cell)::before{display:none !important}

<div id="app"><div style="padding:40px;text-align:center">جاري تحميل نظام توجيه العلوم...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>/* Module: core */

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}

function statusBadge(s){const l=STATUS_LABELS[s]||s;const cls=s==='approved'?'ok':s==='returned_for_edit'?'danger':s==='pending_manager_approval'?'warn':'info';return `<span class="badge ${cls}">${esc(l)}</span>`}

function intakeStatusBadge(s){const l=INTAKE_STATUS_LABELS[s]||s;const cls=s==='imported'?'ok':s==='rejected'?'danger':s==='approved_for_import'?'warn':s==='under_review'?'info':'info';return `<span class="badge ${cls}">${esc(l)}</span>`}

function modal(html){let m=document.getElementById('modal');if(!m){m=document.createElement('div');m.id='modal';m.className='modal-backdrop';document.body.appendChild(m)}m.innerHTML=`<div class="modal-card">${html}</div>`;m.classList.add('show');document.body.classList.add('mobile-modal-open');requestAnimationFrame(()=>enhanceResponsiveReports(m))}

function closeModal(){document.getElementById('modal')?.remove();document.body.classList.remove('mobile-modal-open');requestAnimationFrame(()=>refreshMobileActionBar(document.getElementById('content')))}

function moneySafeError(e){console.error(e);toast(e?.message||'حدث خطأ غير متوقع')}

async function dashboardPage({force=false}={}){
 if(profile?.role==='supervisor')return supervisorWorkspacePage({force});
 const payload=await cachedRead('dashboard:stats',async signal=>{
  let q=sb.rpc('get_dashboard_stats',{p_term_id:activeTerm?.id||null});q=abortable(q,signal);const {data,error}=await q;if(error)throw error;return data||{};
 },{ttl:20000,force});
 const stats=(payload?.metrics||[]).map(x=>[x.label,x.value]);
 const primaryStats=stats.slice(0,Math.max(0,stats.length-3)),personnelStats=stats.slice(-3);
 const statCards=items=>items.map(x=>`<div class="card stat-card"><div class="stat-label">${esc(x[0])}</div><div class="stat-value">${esc(x[1])}</div></div>`).join('');
 const seniorActions=profile.role==='senior_teacher'?`<div class="card supervisor-tools-card"><div class="card-title"><div><h3>إدارة قسم العلوم</h3><p class="muted">بصفتك مشرف المادة يمكنك إضافة معلمي مدرستك، وإسناد الفصول لهم، وتعديل الإسنادات القائمة داخل مدرستك.</p></div><span class="badge info">صلاحيات مشرف المادة</span></div><div class="supervisor-tools-grid"><button class="supervisor-tool-btn primary-tool" onclick="seniorTeacherAddTeacherForm()"><span class="tool-icon">＋</span><strong>إضافة معلم</strong><small>تسجيل معلم جديد وربطه بالمدرسة</small></button><button class="supervisor-tool-btn" onclick="go('assignments')"><span class="tool-icon">Σ</span><strong>توزيع وتعديل الحصص</strong><small>إسناد الفصول أو تغيير المعلم المسند</small></button><button class="supervisor-tool-btn" onclick="go('classes')"><span class="tool-icon">▦</span><strong>مراجعة الفصول</strong><small>عرض الفصول الفعلية للعام الحالي</small></button></div></div>`:'';
 const supervisorRoleHint=profile.role==='teacher'&&userRoles.includes('senior_teacher')?`<div class="notice info"><b>أنت مسجل أيضًا كمشرف للمادة.</b> صلاحيات إضافة المعلمين وتوزيعهم على الفصول تظهر عند الدخول بدور «مشرف المادة». <button class="btn primary" style="margin-inline-start:8px" onclick="selectRole('senior_teacher')">الدخول كمشرف المادة</button></div>`:'';
 return `<div class="page-head"><div><h2>مرحبًا، ${esc(profile.full_name)}</h2><p>الموقف الحالي للعام ${esc(activeYear?.label||'')}.</p></div></div><div class="grid4 dashboard-primary-stats">${statCards(primaryStats)}</div><div class="grid4 dashboard-personnel-stats">${statCards(personnelStats)}</div>${supervisorRoleHint}${seniorActions}<div class="card"><h3>دورة العمل</h3><p class="muted">الموجه الأول يدير التوزيع العام، ومنسق المرحلة يراجع ويعدل بيانات مدارس ومعلمي وموجهي مرحلته، والموجه يدير مدارسه، ومشرف المادة يستكمل المعلمين والفصول وتوزيع فصول العلوم، والاعتماد النهائي يظل حسب جهة الاعتماد المحددة لكل مدرسة.</p></div>`;
}

/* Module: data-access */

function abortable(builder,signal){return signal&&typeof builder?.abortSignal==='function'?builder.abortSignal(signal):builder}

function cachedRead(key,loader,options){return AppDataStore.get(key,loader,options)}

function invalidateData(...domains){AppDataStore.invalidate(...domains)}

async function refreshCurrentPage({invalidate=[]}={}){
 if(invalidate.length){invalidateData(...invalidate);invalidateData('alerts')}
 const c=document.getElementById('content');if(!c)return renderShell();
 c.innerHTML='<div class="card">جاري تحديث البيانات...</div>';
 await loadPage(true);
 refreshAlertBadge({force:invalidate.length>0}).catch(()=>{});
}

function reloadCurrentPage(){return refreshCurrentPage({invalidate:[`page:${currentPage}`,'dashboard','hierarchy']}).catch(moneySafeError)}

async function count(table){const {count}=await sb.from(table).select('*',{count:'exact',head:true});return count||0}


/* Module: smart-alerts v65 */
let __alertsLast=[];
function alertSeverityMeta(level){return level==='danger'?{label:'عاجل',icon:'!'}:level==='warn'?{label:'يحتاج متابعة',icon:'⚠'}:{label:'معلومة',icon:'i'}}
function alertValidCivil(v){return /^\d{14}$/.test(String(v||'').trim())}
function alertHasNav(page){return (NAV?.[profile?.role]||[]).some(x=>x[0]===page)}
function alertTargetPage(preferred){if(alertHasNav(preferred))return preferred;if(preferred==='assignments')return alertHasNav('teachers')?'teachers':'schools';if(preferred==='workload')return alertHasNav('teachers')?'teachers':'dashboard';return alertHasNav('schools')?'schools':'dashboard'}
function alertPush(list,a){if(!a?.key||list.some(x=>x.key===a.key))return;list.push({level:'info',title:'تنبيه',message:'',page:'dashboard',...a})}
function alertDuplicateCivils(rows=[]){const m=new Map();for(const r of rows){const c=String(r.civil_id||'').replace(/\D/g,'');if(!c)continue;(m.get(c)||m.set(c,[]).get(c)).push(r)}return [...m.entries()].filter(([,v])=>v.length>1)}
async function loadSmartAlerts({force=false}={}){
 if(!profile||!activeTerm)return [];
 const key=`alerts:dataset:${activeTerm.id}`;
 return cachedRead(key,async signal=>{
  const q=abortable(sb.rpc('get_reports_dataset',{p_term_id:activeTerm.id}),signal);const r=await q;if(r.error)throw r.error;
  const sr=await sb.from('school_submissions').select('id,school_id,status,submitted_at,updated_at,return_reason').eq('term_id',activeTerm.id);if(sr.error)throw sr.error;
  const ds=r.data||{},h=ds.hierarchy||{};
  const schools=Array.isArray(h.schools)?h.schools:[],scopeTeachers=v91ScopeRows(ds),teachers=v91UniqueGlobalTeachers(scopeTeachers,Array.isArray(h.teachers)?h.teachers:(Array.isArray(ds.teacher_records)?ds.teacher_records:[])),sups=Array.isArray(h.sups)?h.sups:[];
  const classes=Array.isArray(ds.classes)?ds.classes:[],rules=Array.isArray(ds.rules)?ds.rules:[],assignments=Array.isArray(ds.assignments)?ds.assignments:[];
  const plan=buildOperationalSchoolPlanData({schools,classes,teachers,schoolTeacherRosters:scopeTeachers,rules,assignments,periodLabel:[activeYear?.label,activeTerm?.name].filter(Boolean).join(' — ')});
  const smap=Object.fromEntries((sr.data||[]).map(x=>[x.school_id,x]));
  const classBySchool={},teacherBySchool={},classSchool={},assignsBySchool={};
  classes.forEach(c=>{(classBySchool[c.school_id]||(classBySchool[c.school_id]=[])).push(c);classSchool[c.id]=c.school_id});
  (scopeTeachers.length?scopeTeachers:teachers).forEach(t=>{const sid=scopeTeachers.length?v91ScopeSchoolId(t):t.home_school_id;if(sid)(teacherBySchool[sid]||(teacherBySchool[sid]=[])).push(t)});
  assignments.forEach(a=>{const sid=classSchool[a.class_id];if(sid)(assignsBySchool[sid]||(assignsBySchool[sid]=[])).push(a)});
  const list=[];
  for(const row of plan.rows||[]){
   const sid=row.school_id,school=schools.find(x=>x.id===sid)||{},sub=smap[sid],detail=(classBySchool[sid]||[]),assigned=new Set((assignsBySchool[sid]||[]).map(a=>a.class_id)).size;
   if(!row.calculation_ready)alertPush(list,{key:`school-incomplete:${sid}`,level:'danger',title:`بيانات مدرسة غير مكتملة — ${row.school_name}`,message:'عدد الفصول أو البيانات اللازمة للحساب غير مكتملة، لذلك لا يمكن الاعتماد على موقف العجز والزيادة.',page:'schools',schoolId:sid,schoolName:row.school_name});
   if(Number(row.remaining_deficit||0)>0)alertPush(list,{key:`school-deficit:${sid}`,level:'warn',title:`عجز في ${row.school_name}`,message:`العجز الفعلي ${Number(row.remaining_deficit||0)} حصة وفق الفصول والأنصبة الحالية.`,page:'workload',schoolId:sid,schoolName:row.school_name});
   if(Number(row.surplus||0)>0)alertPush(list,{key:`school-surplus:${sid}`,level:'warn',title:`زيادة في ${row.school_name}`,message:`الزيادة الحالية ${Number(row.surplus||0)} حصة. راجع توزيع الفصول والأنصبة قبل النقل أو إعادة التوزيع.`,page:'workload',schoolId:sid,schoolName:row.school_name});
   if(detail.length>0&&assigned<detail.length)alertPush(list,{key:`uncovered:${sid}`,level:'danger',title:`فصول غير مغطاة — ${row.school_name}`,message:`تم إسناد ${assigned} من ${detail.length} فصل فقط؛ المتبقي ${detail.length-assigned} فصل بلا إسناد.`,page:'assignments',schoolId:sid,schoolName:row.school_name});
   if(approvalStateForUser(school,sub).bucket==='mine')alertPush(list,{key:`approval-pending:${sid}`,level:'warn',title:`بيانات تنتظر اعتمادك — ${row.school_name}`,message:'المدرسة أرسلت بياناتها وهي الآن ضمن صلاحية اعتماد حسابك.',page:'approval',schoolId:sid,schoolName:row.school_name});
   if(sub?.status==='returned_for_edit'||school.status==='returned_for_edit')alertPush(list,{key:`approval-returned:${sid}`,level:'danger',title:`بيانات معادة للتعديل — ${row.school_name}`,message:sub?.return_reason?`سبب الإعادة: ${sub.return_reason}`:'البيانات معادة للتعديل وتحتاج استكمالًا قبل إعادة الإرسال.',page:'approval',schoolId:sid,schoolName:row.school_name});
   if(!school.stage||!String(school.name||'').trim())alertPush(list,{key:`school-fields:${sid}`,level:'danger',title:`بيانات أساسية ناقصة — ${row.school_name||'مدرسة'}`,message:'اسم المدرسة أو المرحلة غير مكتمل.',page:'schools',schoolId:sid,schoolName:row.school_name});
  }

/* Module: smart-navigation v69 */
const APP_NAV_KEY='science_guidance_nav_v69';
let __appNavApplyingHistory=false;
function appNavAllowed(page){return (NAV?.[profile?.role]||[]).some(x=>x[0]===page)||page==='dashboard'}
function appNavLabel(page){if(page==='dashboard')return 'الرئيسية';const n=(NAV?.[profile?.role]||[]).find(x=>x[0]===page);return n?.[1]||mobileNavShort(page)||page}
function appNavRead(){try{return JSON.parse(sessionStorage.getItem(APP_NAV_KEY)||'{}')||{}}catch{return {}}}
function appNavWrite(v){try{sessionStorage.setItem(APP_NAV_KEY,JSON.stringify(v))}catch{}}
function appNavRoute(page){return `#/${encodeURIComponent(page||'dashboard')}`}
function appNavHashPage(){try{const x=decodeURIComponent(String(location.hash||'').replace(/^#\//,''));return x&&appNavAllowed(x)?x:null}catch{return null}}
function appNavRemember(from,to){if(!from||from===to)return;const st=appNavRead();st.previous=from;st.current=to;st.lastDifferent=from;st.updatedAt=Date.now();appNavWrite(st)}
function appNavPush(page,{replace=false}={}){const hash=appNavRoute(page);const state={scienceGuidance:true,page};if(replace||!history.state?.scienceGuidance)history.replaceState(state,'',hash);else if(location.hash!==hash)history.pushState(state,'',hash)}
function appNavGoBack(){if(history.length>1){history.back();return}appNavHome()}
function appNavHome(){if(currentPage==='dashboard')return;go('dashboard')}
function appNavLast(){const st=appNavRead();const target=[st.lastDifferent,st.previous].find(p=>p&&p!==currentPage&&appNavAllowed(p));if(target)return go(target);toast('لا توجد شاشة سابقة محفوظة')}

async function schoolDeleteDependencyCounts(schoolId){
 const safeCount=async(table,column)=>{
  try{
   const {count,error}=await sb.from(table).select('id',{count:'exact',head:true}).eq(column,schoolId);
   if(error)throw error;
   return Number(count||0);
  }catch(error){throw error}
 };
 const safeCountOr=async(table,cols)=>{
  try{
   let total=0;
   for(const col of cols){
    const {count,error}=await sb.from(table).select('id',{count:'exact',head:true}).eq(col,schoolId);
    if(error)throw error;total+=Number(count||0);
   }
   return total;
  }catch(error){throw error}
 };

 const [
  classes,
  teachers,
  submissions,
  supervisorAssignments,
  dataIntake,
  dataCollection,
  delegations,
  teacherAssignments
 ]=await Promise.all([
  safeCount('school_classes','school_id'),
  safeCount('teacher_records','home_school_id'),
  safeCount('school_submissions','school_id'),
  safeCount('supervisor_school_assignment_reference_2026_2027','school_id'),
  safeCount('school_data_intake','school_id'),
  safeCount('data_collection_submissions','school_id'),
  safeCountOr('delegations',['from_school_id','to_school_id']),
  safeCount('teacher_school_assignments','school_id')
 ]);

 return {
  classes,teachers,submissions,supervisorAssignments,
  dataIntake,dataCollection,delegations,teacherAssignments
 };
}

function workloadTeachingTarget(t){
 if(isPaidTeacher(t))return null;
 if(t?.weekly_target==null)return null;
 if(t?.workload_rule_type==='maximum')return Number(t.weekly_target||0);
 return planTeacherTeachingCapacity(Number(t.weekly_target||0),Number(t.supervision_periods||0),t.home_school_stage);
}

function workloadTeachingTargetLabel(t){
 if(isPaidTeacher(t))return 'حسب إسناد المدرسة';
 const target=workloadTeachingTarget(t);if(target==null)return '—';
 const duties=Number(t?.supervision_periods||0);
 const total=target+duties,legal=Number(t?.weekly_target||0),delta=total-legal;
 // حصتا الإشراف تدخلان في الإجمالي ولا تُحتسبان زيادة؛ الزيادة = التدريس − النصاب.
 const supervision=Number(t?.supervision_periods||0),countedSurplus=total-supervision-legal;
 const deltaText=countedSurplus>0?`زيادة ${countedSurplus}`:delta<0?`نقص ${Math.abs(delta)}`:supervision&&delta>0?'مكتمل — الإشراف لا يُحتسب زيادة':'مطابق';
 return `${target} تدريس${duties?` + ${duties} إشراف`:''} = ${total} (${deltaText})`;
}

function supervisorDirectoryName(s){return s?.full_name||s?.profile?.full_name||'بدون اسم'}

function supervisorDirectoryCivil(s){return s?.civil_id||s?.profile?.civil_id||''}

function supervisorDirectoryPhone(s){return s?.phone||s?.profile?.phone||''}

function supervisorDirectoryIsCoordinator(s){return (s?.stage_coordinator_assignments||[]).some(x=>x.active)}

function supervisorDirectoryStages(s){

async function loadSupervisorHierarchy({force=false}={}){
 return cachedRead('hierarchy:full',async signal=>{
  const q=abortable(sb.rpc('get_supervisor_hierarchy_data'),signal);
  const {data,error}=await q;
  if(error)throw error;
  const sups=Array.isArray(data?.sups)?data.sups:[];
  const schools=Array.isArray(data?.schools)?data.schools:[];
  const teachers=Array.isArray(data?.teachers)?data.teachers:[];
  const bySchool={},bySup={};
  teachers.forEach(t=>{if(t.home_school_id)(bySchool[t.home_school_id]||(bySchool[t.home_school_id]=[])).push(t)});
  schools.forEach(sc=>{const k=sc.supervisor_id||'__unassigned__';(bySup[k]||(bySup[k]=[])).push(sc)});
  return {sups,schools,teachers,bySchool,bySup};
 },{ttl:45000,force});
}

/* Module: assignments */

function summaryPlanNumber(value){
 const number=Number(value||0);
 return Number.isFinite(number)?number:0;
}

function normalizePlanGrade(grade){return String(grade||'').replace(/^الصف\s+/,'').trim()}

function planJobRuleTitle(title){return ['معلم','معلم مساعد'].includes(String(title||'').trim())?'معلم مساعد + معلم':String(title||'').trim()}

function planRuleTarget(teacher,stage,rules){
 if(isPaidTeacher(teacher))return null;
 const title=planJobRuleTitle(teacher?.job_title),today=new Date().toISOString().slice(0,10);
 const matches=(rules||[]).filter(rule=>rule.active!==false&&rule.stage===stage&&rule.job_title===title&&(!rule.effective_from||rule.effective_from<=today)&&(!rule.effective_to||rule.effective_to>=today)).sort((a,b)=>String(b.effective_from||'').localeCompare(String(a.effective_from||'')));
 return matches.length?summaryPlanNumber(matches[0].weekly_norm):null;
}

function planClassPeriods(row){
 const requirementTotal=(row?.class_subject_requirements||[]).reduce((sum,item)=>sum+summaryPlanNumber(item.weekly_periods),0);
 if(requirementTotal>0)return requirementTotal;
 if(summaryPlanNumber(row?.science_periods)>0)return summaryPlanNumber(row.science_periods);
 return row?.stage==='إعدادي'?PREPARATORY_SCIENCE_PERIODS_PER_CLASS:0;
}

function planTeachingBlockUnit(stage){return stage==='إعدادي'?PREPARATORY_SCIENCE_PERIODS_PER_CLASS:1}

function planNearestWholeClassLoad(rawPeriods,stage){
 const raw=Math.max(summaryPlanNumber(rawPeriods),0),unit=planTeachingBlockUnit(stage);
 if(unit<=1)return raw;
 return Math.max(0,Math.floor((raw+(unit/2))/unit)*unit);
}

function planTeacherTeachingCapacity(target,personalDuties,stage){
 if(target==null)return 0;
 return planNearestWholeClassLoad(Math.max(summaryPlanNumber(target)-summaryPlanNumber(personalDuties),0),stage);
}

function buildOperationalSchoolPlanData(input={}){
 const schools=(input.schools||[]).filter(s=>s.stage==='إعدادي');
 const classes=input.classes||[],teachers=(input.teachers||[]).filter(t=>t.active!==false),rules=input.rules||[],assignments=input.assignments||[];
 const classesBySchool={},teachersBySchool={},classToSchool={};
 classes.forEach(row=>{classToSchool[row.id]=row.school_id;(classesBySchool[row.school_id] ||= []).push(row)});
 teachers.forEach(row=>{if(row.home_school_id)(teachersBySchool[row.home_school_id] ||= []).push(row)});
 const paidTeacherIds=new Set(teachers.filter(t=>String(t.work_type||'')==='paid').map(t=>t.id));
 const paidAssignedBySchool={};
 assignments.forEach(row=>{const schoolId=classToSchool[row.class_id];if(schoolId&&paidTeacherIds.has(row.teacher_id))paidAssignedBySchool[schoolId]=(paidAssignedBySchool[schoolId]||0)+summaryPlanNumber(row.weekly_periods)});

 const rows=schools.map(school=>{
  const detailed=classesBySchool[school.id]||[],declaredClasses=summaryPlanNumber(school.class_count);
  const totalClasses=Math.max(declaredClasses,detailed.length);
  const missingDetailed=Math.max(totalClasses-detailed.length,0);
  const requirementFromDetails=detailed.reduce((sum,row)=>sum+planClassPeriods(row),0);
  const requiredPeriods=requirementFromDetails+(missingDetailed*PREPARATORY_SCIENCE_PERIODS_PER_CLASS);
  const defaultPeriodClasses=detailed.filter(row=>(row.class_subject_requirements||[]).reduce((sum,item)=>sum+summaryPlanNumber(item.weekly_periods),0)===0&&summaryPlanNumber(row.science_periods)===0).length;
  const gradeCount=grade=>detailed.filter(row=>normalizePlanGrade(row.grade)===grade).length;
  const schoolTeachers=teachersBySchool[school.id]||[];
  const permanent=schoolTeachers.filter(t=>String(t.work_type||'permanent')!=='paid');
  const paid=schoolTeachers.filter(t=>String(t.work_type||'')==='paid');
  const targetDetails=permanent.map(teacher=>{
   const target=planRuleTarget(teacher,school.stage,rules);
   const supervision=teacher.is_senior_teacher?2:0;
   // حصتا الإشراف تدخلان في النصاب الشخصي، ثم يحول المتبقي إلى أقرب عدد صالح من الفصول الكاملة (كل فصل إعدادي = 4 حصص علوم).
   const personalDuties=supervision;
   const schoolCoverageDuties=personalDuties;
   const rawTeachingTarget=target==null?null:Math.max(target-personalDuties,0);
   const available=target==null?0:planTeacherTeachingCapacity(target,personalDuties,school.stage);
   return {teacher,target,supervision,schoolCoverageDuties,personalDuties,rawTeachingTarget,available};
  });
  const missingTargets=targetDetails.filter(item=>item.target==null).length;
  const basicNormTotal=targetDetails.reduce((sum,item)=>sum+summaryPlanNumber(item.target),0);
  const internalDuties=targetDetails.reduce((sum,item)=>sum+item.schoolCoverageDuties,0);
  const supervisionPeriods=targetDetails.reduce((sum,item)=>sum+item.supervision,0);
  const personalDuties=targetDetails.reduce((sum,item)=>sum+item.personalDuties,0);
  const basicCapacity=targetDetails.reduce((sum,item)=>sum+item.available,0);
  const paidAssigned=summaryPlanNumber(paidAssignedBySchool[school.id]);
  const calculationReady=totalClasses>0;
  const paidRequired=calculationReady?Math.max(requiredPeriods-basicCapacity,0):null;
  const remainingDeficit=calculationReady?Math.max(paidRequired-paidAssigned,0):null;
  const surplus=calculationReady?Math.max(basicCapacity-requiredPeriods,0):null;
  const classSource=detailed.length===0?'school_total':missingDetailed>0?'mixed':'detailed';
  const normFormula=targetDetails.filter(item=>item.target!=null).map(item=>`${item.target}${item.personalDuties?`-${item.personalDuties}`:''}→${item.available}`).join(' + ');
  const notes=[];
  if(!calculationReady)notes.push('عدد الفصول غير مدخل');
  else if(classSource==='school_total')notes.push('إجمالي المدرسة × 4');
  else if(classSource==='mixed')notes.push(`${detailed.length} فصل مفصل + ${missingDetailed} غير مفصل × 4`);
  if(defaultPeriodClasses)notes.push(`${defaultPeriodClasses} فصل محسوب × 4 لعدم تحديد حصص مواده`);
  if(!permanent.length&&calculationReady)notes.push('بدون معلم أساسي');
  if(missingTargets)notes.push(`${missingTargets} معلم بلا درجة/نصاب معتمد`);
  if(normFormula)notes.push(`الأنصبة القانونية ← بعد الإشراف ← أقرب حمل فصول كاملة: ${normFormula}`);

async function intakeApi(body){

 if(error){
  let message=data?.error||error?.message||'تعذر الاتصال بخدمة البيانات الواردة';
  try{
   if(error?.context?.json){const payload=await error.context.json();message=payload?.error||payload?.message||message}
  }catch(_){/* keep fallback message */}
  throw new Error(message);
 }
 if(data?.error)throw new Error(data.error);
 return data;
}

function renderVirtualTableWindow(state,reset=false){
 if(reset){state.rendered=0;state.tbody.innerHTML=''}
 const rows=state.filteredRows||state.allRows;
 const end=Math.min(rows.length,state.rendered+state.batchSize);
 const frag=document.createDocumentFragment();for(let i=state.rendered;i<end;i++)frag.appendChild(rows[i]);
 state.tbody.appendChild(frag);state.rendered=end;
 if(state.sentinel)state.sentinel.textContent=end<rows.length?`عرض ${end} من ${rows.length} — مرر لأسفل لتحميل المزيد`:`تم عرض ${rows.length} سجل`;
}

function virtualizeLargeTable(table){
 if(!table?.tBodies?.[0])return;const previous=VirtualTableStore.get(table.id);if(previous?.table===table)return;if(previous){previous.table?.closest?.('.table-wrap')?.removeEventListener?.('scroll',previous.onScroll);previous.sentinel?.remove();VirtualTableStore.delete(table.id)}
 const tbody=table.tBodies[0],allRows=[...tbody.rows].filter(r=>!r.querySelector('td[colspan]'));
 if(allRows.length<=100)return;
 const state={table,tbody,allRows,filteredRows:allRows.slice(),rendered:0,batchSize:70,sentinel:null};
 allRows.forEach(r=>r.remove());
 const wrap=table.closest('.table-wrap');if(!wrap)return;
 wrap.classList.add('virtual-table-wrap');
 const sentinel=document.createElement('div');sentinel.className='virtual-table-sentinel no-print';wrap.appendChild(sentinel);state.sentinel=sentinel;
 VirtualTableStore.set(table.id,state);renderVirtualTableWindow(state,true);
 const onScroll=()=>{if(wrap.scrollTop+wrap.clientHeight>=wrap.scrollHeight-180&&state.rendered<(state.filteredRows||state.allRows).length)renderVirtualTableWindow(state)};
 wrap.addEventListener('scroll',onScroll,{passive:true});state.onScroll=onScroll;
}

function virtualizeLargeTables(root){root?.querySelectorAll('table.table').forEach(virtualizeLargeTable)}

function filterNormalize(v){
 return String(v??'')
  .toLowerCase()
  .replace(/[\u064B-\u065F\u0670]/g,'')
  .replace(/[أإآٱ]/g,'ا')
  .replace(/ى/g,'ي')
  .replace(/ؤ/g,'و')
  .replace(/ئ/g,'ي')
  .replace(/ة/g,'ه')
  .replace(/\s+/g,' ')
  .trim()
}

function filterCellText(cell){
 if(!cell)return '';

 // في الأعمدة التي تحتوي قوائم اختيار، نقرأ الاختيار الحالي فقط
 // ولا نقرأ كل الخيارات؛ حتى يكون فلتر الموجه دقيقًا.
 const select=cell.querySelector('select');
 if(select){
   const selected=select.options?.[select.selectedIndex];
   return (selected?.textContent||'').replace(/\s+/g,' ').trim();
 }

 const input=cell.querySelector('input');
 if(input&&input.type!=='hidden'){
   return String(input.value||'').replace(/\s+/g,' ').trim();
 }

 return (cell.innerText||'').replace(/\s+/g,' ').trim();
}

function tableRowDataCells(row){
 return [...(row?.cells||[])].filter(cell=>!cell.classList.contains('compact-record-summary-cell'));
}

function filterOptionValues(cell){
 if(!cell)return [];

 const select=cell.querySelector('select');
 if(select){
   const selected=select.options?.[select.selectedIndex];
   const text=(selected?.textContent||'').replace(/\s+/g,' ').trim();
   return text?[text]:[];
 }

 const chips=[...cell.querySelectorAll('.chip')].map(x=>x.innerText.trim()).filter(Boolean);
 if(chips.length)return chips;

 const badges=[...cell.querySelectorAll('.badge')].map(x=>x.innerText.trim()).filter(Boolean);
 if(badges.length)return badges;

 const bold=cell.querySelector('b');
 if(bold&&bold.innerText.trim())return [bold.innerText.trim()];

 const t=filterCellText(cell);
 return t?[t]:[];
}


function syncMobileEntityCardsForTable(tableId){
 const lists=[...document.querySelectorAll('.mobile-entity-cards')].filter(x=>x.dataset.sourceTable===tableId);
 if(!lists.length)return;
 lists.forEach(list=>{
  let shown=0;
  [...list.children].forEach(card=>{
   if(card.classList.contains('mobile-filter-empty'))return;
   const row=card.__sourceRow;
   const visible=!row||row.dataset.filterVisible!=='0';
   card.hidden=!visible;
   card.style.display=visible?'':'none';
   if(visible)shown++;
  });
  let empty=list.querySelector('.mobile-filter-empty');
  if(!empty){
   empty=document.createElement('div');
   empty.className='notice mobile-filter-empty';
   empty.textContent='لا توجد نتائج مطابقة للبحث.';
   list.appendChild(empty);
  }
  empty.hidden=shown>0;
  empty.style.display=shown>0?'none':'';
  list.dataset.visibleCount=String(shown);
 });
}

function applyAutoTableFilters(tableId){
 const table=document.getElementById(tableId);if(!table||!table.tBodies?.length)return;
 const controls=[...document.querySelectorAll(`[data-filter-table="${tableId}"]`)];
 const state=VirtualTableStore.get(tableId);
 const rows=state?state.allRows:[...table.tBodies[0].rows];
 let total=0,visible=0;const matched=[];
 rows.forEach(row=>{
  const cells=tableRowDataCells(row);
  if(!cells.length||cells.some(c=>c.hasAttribute('colspan'))){row.dataset.filterVisible='1';if(!state)row.style.display='';return}
  total++;let ok=true;
  for(const c of controls){
   const q=filterNormalize(c.value);if(!q)continue;
   if(c.dataset.filterType==='search'){
    if(!filterNormalize(cells.map(filterCellText).join(' ')).includes(q)){ok=false;break}
   }else{

 });

function buildAutoTableFilterBar(table,tableId,index){

 return `<div class="auto-filter-bar no-print" data-auto-filter-for="${tableId}">${searchRow}${optionsRow}</div>`

function compactDirectoryCellText(cell){
 if(!cell)return '';
 const select=cell.querySelector('select');
 if(select)return (select.options?.[select.selectedIndex]?.textContent||'').replace(/\s+/g,' ').trim();
 const input=cell.querySelector('input:not([type="hidden"])');
 if(input)return String(input.value||'').replace(/\s+/g,' ').trim();
 const copy=cell.cloneNode(true);
 copy.querySelectorAll('button,.btn,.actions,.cell-sub,script,style').forEach(x=>x.remove());
 return (copy.textContent||'').replace(/\s+/g,' ').trim();
}

function compactDirectoryPrimaryIndex(headers,cells){
 for(const label of COMPACT_PRIMARY_HEADERS){
   const index=headers.findIndex((header,i)=>header===label&&compactDirectoryCellText(cells[i]));
   if(index>=0)return index;
 }
 const fallback=headers.findIndex((header,i)=>!COMPACT_ACTION_HEADERS.has(header)&&compactDirectoryCellText(cells[i]));
 return fallback>=0?fallback:0;
}

function compactDirectoryMetaIndices(headers,cells,primaryIndex){
 const picked=[];
 const add=index=>{
   if(index<0||index===primaryIndex||picked.includes(index)||COMPACT_ACTION_HEADERS.has(headers[index]))return;
   if(!compactDirectoryCellText(cells[index]))return;
   picked.push(index);
 };
 COMPACT_META_HEADERS.forEach(label=>add(headers.findIndex(h=>h===label)));
 headers.forEach((header,index)=>add(index));
 return picked.slice(0,3);
}

const AppDataStore=(()=>{
 const cache=new Map(),inflight=new Map(),controllers=new Map();
 const scopedKey=(key)=>`${activeRole||'none'}|${profile?.id||'anon'}|${activeTerm?.id||'no-term'}|${key}`;
 function now(){return Date.now()}
 function matches(k,patterns){return !patterns.length||patterns.some(p=>k.includes(String(p)))}
 async function get(key,loader,{ttl=30000,force=false}={}){
  const k=scopedKey(key),hit=cache.get(k);
  if(!force&&hit&&hit.expires>now())return hit.value;
  if(!force&&inflight.has(k))return inflight.get(k);
  controllers.get(k)?.abort();
  const controller=new AbortController();controllers.set(k,controller);
  const p=Promise.resolve().then(()=>loader(controller.signal)).then(value=>{
   if(!controller.signal.aborted)cache.set(k,{value,expires:now()+ttl});
   return value;
  }).finally(()=>{if(inflight.get(k)===p)inflight.delete(k);if(controllers.get(k)===controller)controllers.delete(k)});
  inflight.set(k,p);return p;
 }
 function invalidate(...patterns){
  [...cache.keys()].forEach(k=>{if(matches(k,patterns))cache.delete(k)});
  [...controllers.entries()].forEach(([k,c])=>{if(matches(k,patterns)){c.abort();controllers.delete(k);inflight.delete(k)}});
 }
 function clear(){cache.clear();inflight.clear();controllers.forEach(c=>c.abort());controllers.clear()}
 function stats(){return {cache:cache.size,inflight:inflight.size}}
 return {get,invalidate,clear,stats};
})();

function reportVisualOverflow(node,tolerance=REPORT_LAYOUT_TOLERANCE_PX){
 if(!node)return {x:false,y:false};
 const nr=node.getBoundingClientRect();
 const scaleX=nr.width/Math.max(1,node.clientWidth),scaleY=nr.height/Math.max(1,node.clientHeight);
 const tx=Math.max(1,tolerance*Math.max(.15,scaleX)),ty=Math.max(1,tolerance*Math.max(.15,scaleY));
 let x=false,y=false;
 [...node.children].forEach(ch=>{const cs=getComputedStyle(ch);if(cs.display==='none'||cs.visibility==='hidden')return;const r=ch.getBoundingClientRect();if(r.width<=0&&r.height<=0)return;if(r.left<nr.left-tx||r.right>nr.right+tx)x=true;if(r.top<nr.top-ty||r.bottom>nr.bottom+ty)y=true;});
 return {x,y};
}

function currentReportFilterState(reportId){
 const root=document.getElementById('content');
 const state={search:'',filters:[],active:false,sourcePage:currentPage||'',reportId};

 const setSearch=v=>{
  v=String(v||'').trim();
  if(v){state.search=v;state.active=true}
 };

  value=String(value||'').trim();
  if(!value)return;

 // صفحة التقارير: فلتر عام.

  addFilter('المدرسة',document.getElementById('reportsGlobalSchool')?.value);

 }

  addFilter('الموجه',document.getElementById('supervisorMapGlobalSupervisor')?.value);

 }

 bars.forEach(bar=>{
  const tableId=bar.dataset.autoFilterFor;
  const table=document.getElementById(tableId);
  const headers=[...(table?.querySelectorAll('thead th')||[])].map(x=>(x.innerText||'').replace(/\s+/g,' ').trim());

  bar.querySelectorAll(`[data-filter-table="${tableId}"]`).forEach(control=>{
   const value=String(control.value||'').trim();

}

    metric('إجازة مجددة',rows.filter(r=>r.leaveCode==='renewed').length),
    metric('إجمالي النصاب المالي',reportSum(rows,'financial')),
    metric('إجمالي الإشراف',reportSum(rows,'supervision')),
    metric('الإجمالي المالي',reportSum(rows,'total'))
   ];
   schema.totals=[
    total('المعلمون',rows.length),
    total('النصاب المالي',reportSum(rows,'financial')),
    total('الإشراف',reportSum(rows,'supervision')),
    total('الإجمالي',reportSum(rows,'total'))
   ];
   break;
  case 'workload':
   schema.summary=[metric('عدد الدرجات',rows.length),metric('النتائج المفلترة',rows.length)];
   schema.totals=[total('إجمالي النتائج',rows.length)];
   break;
  case 'classes':
   schema.summary=[metric('عدد الفصول',rows.length),metric('إجمالي حصص العلوم',reportSum(rows,'periods'))];
   schema.totals=[total('إجمالي الفصول',rows.length),total('إجمالي الحصص',reportSum(rows,'periods'))];
   break;
  case 'distribution':{
   const teachers=new Set(rows.map(r=>filterNormalize(r.teacher)).filter(Boolean)).size;
   const classes=new Set(rows.map(r=>filterNormalize([r.school,r.grade,r.className].join('|'))).filter(Boolean)).size;
   schema.summary=[metric('عدد الإسنادات',rows.length),metric('المعلمون المسندون',teachers),metric('الفصول المسندة',classes),metric('إجمالي الحصص',reportSum(rows,'periods'))];
   schema.totals=[total('إجمالي الإسنادات',rows.length),total('إجمالي الحصص',reportSum(rows,'periods'))];
   break;
  }
  case 'approval':{
   const statusCount=v=>rows.filter(r=>filterNormalize(r.status)===filterNormalize(v)).length;
   schema.summary=[metric('عدد الملفات',rows.length),metric('بانتظار الاعتماد',statusCount('بانتظار الاعتماد')),metric('معتمدة',statusCount('معتمدة')),metric('معادة للتعديل',statusCount('معادة للتعديل'))];
   schema.totals=[total('إجمالي الملفات',rows.length)];
   break;
  }
  case 'deficitSurplus':
   schema.summary=[metric('المدارس بالحالات',rows.length),metric('إجمالي العجز',reportSum(rows,'deficit')),metric('إجمالي الزيادة',reportSum(rows,'surplus'))];
   schema.totals=[total('عدد المدارس',rows.length),total('إجمالي العجز',reportSum(rows,'deficit')),total('إجمالي الزيادة',reportSum(rows,'surplus'))];
   break;
  case 'summaryPlan':
   schema.summary=[
    metric('المدارس',rows.length),
    metric('الفصول',reportSum(rows,'classes')),
    metric('الحصص المطلوبة',reportSum(rows,'required')),
    metric('المعلمون الثابتون',reportSum(rows,'teachers')),
    metric('العجز المتبقي',reportSum(rows,'deficit')),
    metric('الزيادة',reportSum(rows,'surplus'))
   ];
   schema.totals=[
    total('المدارس',rows.length),total('الفصول',reportSum(rows,'classes')),
    total('الحصص المطلوبة',reportSum(rows,'required')),
    total('العجز',reportSum(rows,'deficit')),total('الزيادة',reportSum(rows,'surplus'))
   ];
   break;
 }
 return schema;
}

function applyCurrentFiltersToReportSchema(schema,state){
 if(!state?.active)return {...schema,filterState:{active:false}};

 const q=filterNormalize(state.search||'');
 const filters=state.filters||[];
 const rows=(schema.rows||[]).filter(row=>{
  if(q&&!reportRowSearchText(schema,row).includes(q))return false;
  for(const f of filters){
   const actual=filterNormalize(reportRowValueByFilterLabel(schema,row,f.label));
   if(Array.isArray(f.values)){
    const allowed=f.values.map(filterNormalize).filter(Boolean);
    if(!allowed.length||!allowed.some(v=>actual===v))return false;
    continue;
   }
   const expected=filterNormalize(f.value);
   if(!expected)continue;
   if(['المرحلة','معرف المدرسة'].map(filterNormalize).includes(reportFilterCanonicalLabel(f.label))?actual!==expected:!actual.includes(expected))return false;
  }
  return true;
 });

 const filtered={...schema,rows};
 filtered.subtitle=`${schema.subtitle||''}${schema.subtitle?' — ':''}نتائج حسب البحث والفلاتر الحالية${filters.filter(f=>f.label==='المرحلة'&&f.value).map(f=>' — المرحلة: '+f.value).join('')}${state.schoolLabel?' — المدرسة: '+state.schoolLabel:''}`;
 filtered.filterState={
  active:true,schoolLabel:state.schoolLabel||'',displayFilters:state.displayFilters,
  search:state.search||'',
  filters:filters.map(x=>({label:x.label,value:x.value,values:Array.isArray(x.values)?x.values:undefined})),
  sourcePage:state.sourcePage||''
 };
 rebuildFilteredReportMetrics(filtered);
 return filtered;
}

  const ready=()=>{const fonts=w.document.fonts?.ready||Promise.resolve();Promise.resolve(fonts).catch(()=>{}).finally(()=>{w.requestAnimationFrame(()=>w.requestAnimationFrame(()=>setTimeout(invokePrint,80)));});};

 if(!activeTerm?.id||!activeYear?.id){toast('لا توجد سنة أو فترة دراسية مفعلة');return false}
 // استجابة فورية للموبايل قبل أي استعلام شبكي
 modal(`<h3>إضافة فصل</h3><div class="notice info"><span class="smart-save-state"><span class="smart-spinner"></span>جارٍ تجهيز بيانات المدرسة والفصول...</span></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div>`);
 try{
  const [existingRes,schoolRes]=await Promise.all([
   sb.from('school_classes').select('class_name').eq('school_id',schoolId).eq('term_id',activeTerm.id),
   sb.from('schools').select('id,name,stage').eq('id',schoolId).maybeSingle()
  ]);
  if(existingRes.error)throw existingRes.error;
  if(schoolRes.error)throw schoolRes.error;
  const targetSchool=schoolRes.data;
  if(!targetSchool)throw new Error('تعذر الوصول إلى المدرسة المرتبطة بهذا الحساب');
  const existing=existingRes.data||[];
  const stage=targetSchool.stage||'إعدادي';const existingNames=existing.map(x=>x.class_name);
  modal(`<h3>توليد الفصول جماعيًا</h3><div class="notice info"><b>${esc(targetSchool.name||'المدرسة')}</b> — سيتم الحفظ على نفس المدرسة الموجودة فقط.</div><form id="classBatchForm" onsubmit="saveClass(event,'${schoolId}')"><div class="form-grid"><div class="field"><label>المرحلة</label><input id="classStage" name="stage" value="${esc(stage)}" readonly></div><div class="field"><label>الصف</label><select id="classGrade" name="grade" onchange='uxUpdateClassBatchPreview(${JSON.stringify(existingNames).replaceAll("'","&#39;")});updateCurriculumPreview()'></select></div><div class="field"><label>عدد الفصول</label><input id="classCount" name="class_count" type="number" min="1" max="100" value="1" oninput='uxUpdateClassBatchPreview(${JSON.stringify(existingNames).replaceAll("'","&#39;")})' required></div><div class="field"><label>ابدأ من الفصل رقم</label><input id="classStart" name="start_number" type="number" min="1" max="100" value="1" oninput='uxUpdateClassBatchPreview(${JSON.stringify(existingNames).replaceAll("'","&#39;")})' required></div></div><div class="notice"><b>سيتم إنشاء:</b><div id="classBatchPreview" class="class-bulk-preview"></div><div style="margin-top:7px"><b>مواد الصف:</b> <span id="curriculumPreview"></span></div></div><div class="actions"><button id="saveClassBatch" type="submit" class="btn primary">إنشاء الفصول</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div></form>`);
  const gr=document.getElementById('classGrade');
  if(!gr)throw new Error('تعذر تجهيز نموذج إضافة الفصل');
  gr.innerHTML=gradeRows(stage).map(g=>`<option value="${g.v}">${g.label}</option>`).join('');
  updateCurriculumPreview();uxUpdateClassBatchPreview(existingNames);
  const form=document.getElementById('classBatchForm');if(form)uxSmartifyForm(form,{draftKey:`classes:new:${schoolId}`});
  return true;
 }catch(err){
  console.error('classForm v78',err);
  modal(`<h3>تعذر فتح إضافة فصل</h3><div class="notice danger">${esc(err?.message||'حدث خطأ أثناء تجهيز بيانات المدرسة')}</div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">إغلاق</button></div>`);
  return false;
 }
};

function uxQuickAssignClass(classId,teacherId=null){const tid=teacherId||__assignmentUx?.selectedTeacherId;if(!tid)return toast('اختر المعلم أولًا');const c=uxAssignmentClassById(classId),reqs=uxAssignmentReqs(c);if(!c||!reqs.length)return toast('لا يوجد نصاب صالح لهذا الفصل');if(reqs.length===1)return uxPerformQuickAssignment(tid,classId,reqs[0].subject_id);modal(`<h3>اختر المادة المقررة</h3><div class="notice">${esc(gradeLabel(c.stage,c.grade))} — ${esc(c.class_name)}</div><div class="actions">${reqs.map(r=>`<button class="btn primary" type="button" onclick="closeModal();uxPerformQuickAssignment('${tid}','${classId}','${r.subject_id}')">${esc(r.curriculum_subjects?.subject_name)} — ${r.weekly_periods} حصة</button>`).join('')}<button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`)}
async function uxPerformQuickAssignment(teacherId,classId,subjectId){const chip=document.getElementById(`availableClass_${classId}`);if(chip?.classList.contains('saving'))return;chip?.classList.add('saving');const c=uxAssignmentClassById(classId),req=uxAssignmentReqs(c).find(r=>r.subject_id===subjectId);try{const {data,error}=await sb.rpc('assign_class_atomic',{p_teacher_id:teacherId,p_class_id:classId,p_subject_id:subjectId,p_academic_year_id:activeYear.id,p_term_id:activeTerm.id});if(error)throw error;const t=uxAssignmentCurrentTeacher(teacherId),periods=Number(data?.weekly_periods||req?.weekly_periods||0);__assignmentUx.assigns.push({id:data.id,class_id:classId,teacher_id:teacherId,subject_id:subjectId,weekly_periods:periods,teacher_records:{full_name:t?.full_name},school_classes:{stage:c.stage,grade:c.grade,class_name:c.class_name},curriculum_subjects:{subject_name:req?.curriculum_subjects?.subject_name||''}});if(t)t.teaching_periods=Number(t.teaching_periods||0)+periods;chip?.remove();uxUpdateAssignmentTeacherCard(teacherId);uxAppendAssignmentRow(__assignmentUx.assigns[__assignmentUx.assigns.length-1]);uxRenderAvailableClasses();invalidateData('assignments','teachers','dashboard','approvals','page:reports');uxShowUndo(`تم إسناد ${c.class_name} إلى ${t?.full_name||'المعلم'}`,()=>uxUndoAssignment(data.id));}catch(err){chip?.classList.remove('saving');moneySafeError(err)}}
function uxUpdateAssignmentTeacherCard(tid){const t=uxAssignmentCurrentTeacher(tid),card=document.getElementById(`teacherDrop_${tid}`);if(!t||!card)return;const target=uxAssignmentTeacherTarget(t),assigned=uxAssignmentAssignedCount(tid),remaining=isPaidTeacher(t)?'—':Math.max(0,target-Number(t.teaching_periods||0));const ac=card.querySelector('[data-assigned-count]'),teach=card.querySelector('[data-teaching]'),rem=card.querySelector('[data-remaining]');if(ac)ac.textContent=assigned;if(teach)teach.textContent=t.teaching_periods||0;if(rem)rem.textContent=remaining}
function uxAppendAssignmentRow(a){const box=document.getElementById('assignmentCurrentList');if(!box)return;const empty=box.querySelector('.muted');empty?.remove();const row=document.createElement('div');row.className='assignment-current-row';row.id=`assignmentRow_${a.id}`;row.innerHTML=`<b>${esc(a.teacher_records?.full_name||'')}</b><span>${esc(a.school_classes?.class_name||'')} — ${esc(gradeLabel(a.school_classes?.stage,a.school_classes?.grade))}</span><span>${esc(a.curriculum_subjects?.subject_name||'')}</span><span>${a.weekly_periods}</span>${assignmentEditCanManage()?`<button class="btn secondary" type="button" onclick="editAssignmentForm('${a.id}')">تعديل</button>`:''}`;box.prepend(row)}

assignmentsPage=async function({force=false}={}){const s=await mySchool();if(!s)return '<div class="notice">لا توجد مدرسة مرتبطة بالحساب.</div>';const {data,error}=await cachedRead(`assignments:workspace:${s.id}:${activeTerm.id}`,async signal=>{const q=abortable(sb.rpc('get_assignment_workspace',{p_school_id:s.id,p_term_id:activeTerm.id}),signal);return await q},{ttl:15000,force});if(error)return `<div class="error">${esc(error.message)}</div>`;__assignmentUx={schoolId:s.id,teachers:Array.isArray(data?.teachers)?data.teachers:[],classes:Array.isArray(data?.classes)?data.classes:[],assigns:Array.isArray(data?.assignments)?data.assignments:[],summary:Array.isArray(data?.summary)?data.summary.filter(t=>!t.renewed_leave):[],selectedTeacherId:null};window.__assignmentWorkspace={teachers:__assignmentUx.teachers,classes:__assignmentUx.classes,assignments:__assignmentUx.assigns,schoolId:s.id,termId:activeTerm.id};const first=__assignmentUx.summary.find(t=>Math.max(0,uxAssignmentTeacherTarget(t)-Number(t.teaching_periods||0))>0)||__assignmentUx.summary[0];__assignmentUx.selectedTeacherId=first?.teacher_id||null;const available=uxAssignmentAvailable();return `<div class="page-head"><div><h2>التوزيع السريع للفصول</h2><p>اختر المعلم ثم اضغط على الفصل، أو اسحب الفصل إلى المعلم على الكمبيوتر. لا تظهر هنا إلا الفصول غير المسندة.</p></div></div><div class="assignment-fast-layout"><section><div class="card"><div class="card-title"><h3>المعلمون والأنصبة</h3><span class="badge info">اضغط لاختيار المعلم</span></div><div class="assignment-teacher-list">${__assignmentUx.summary.map(uxTeacherCardMarkup).join('')||'<div class="notice">لا يوجد معلمون.</div>'}</div></div><div class="card"><h3>الإسنادات الحالية</h3><div class="assignment-current-row v118-head" aria-hidden="true"><b>المعلم</b><span>الفصل</span><span>المادة</span><span>الحصص</span>${assignmentEditCanManage()?'<span></span>':''}</div><div id="assignmentCurrentList" class="assignment-current-list v118-assign-list">${__assignmentUx.assigns.length?__assignmentUx.assigns.slice().reverse().map(a=>`<div class="assignment-current-row" id="assignmentRow_${a.id}"><b>${esc(a.teacher_records?.full_name||'')}</b><span>${esc(a.school_classes?.class_name||'')} — ${esc(gradeLabel(a.school_classes?.stage,a.school_classes?.grade))}</span><span>${esc(a.curriculum_subjects?.subject_name||'')}</span><span>${a.weekly_periods}</span>${assignmentEditCanManage()?`<button class="btn secondary" type="button" onclick="editAssignmentForm('${a.id}')">تعديل</button>`:''}</div>`).join(''):'<span class="muted">لا توجد إسنادات بعد.</span>'}</div></div></section><aside class="card available-classes-panel"><div class="card-title"><h3>الفصول غير المسندة</h3><span class="badge warn"><b id="availableClassCount">${available.length}</b> متاح</span></div><div id="availableClassList" class="available-class-list">${available.length?available.map(uxAvailableClassMarkup).join(''):'<div class="assignment-empty">تم إسناد جميع الفصول المتاحة.</div>'}</div><div class="notice info" style="margin-top:10px">الإسناد يتحقق من المدرسة والمادة المقررة. النصاب الوظيفي يطبق على المعلم الثابت؛ معلم الأجر يأخذ الحصص المسندة دون حد أدنى أو أعلى.</div></aside></div>`};

function uxShowUndo(message,action,ms=8000){document.querySelector('.undo-toast')?.remove();const box=document.createElement('div');box.className='undo-toast';box.innerHTML=`<span>${esc(message)}</span><button type="button">تراجع</button>`;document.body.appendChild(box);let done=false;const timer=setTimeout(()=>{if(!done)box.remove()},ms);box.querySelector('button').onclick=async()=>{if(done)return;done=true;clearTimeout(timer);box.querySelector('button').disabled=true;try{await action();box.remove()}catch(err){box.remove();moneySafeError(err)}}}

function uxNormalizeText(v){return String(v??'').trim().replace(/\s+/g,' ')}
function uxHeaderKey(h){const x=uxNormalizeText(h).toLowerCase();const map={'الرقم المدني':'civil_id','رقم مدني':'civil_id','civil_id':'civil_id','civil id':'civil_id','الاسم':'full_name','الاسم الكامل':'full_name','full_name':'full_name','name':'name','اسم المدرسة':'name','المدرسة':'school','school':'school','school_id':'school_id','المرحلة':'stage','stage':'stage','الصف':'grade','grade':'grade','الفصل':'class_name','اسم الفصل':'class_name','class_name':'class_name','الهاتف':'phone','phone':'phone','البريد':'email','البريد الإلكتروني':'email','email':'email','الدرجة الوظيفية':'job_title','job_title':'job_title','نوع العمل':'work_type','work_type':'work_type','تاريخ الحصول على الدرجة':'grade_acquired_date','grade_acquired_date':'grade_acquired_date','تاريخ استلام العمل':'work_start_date','work_start_date':'work_start_date','تاريخ التعيين':'appointment_date','appointment_date':'appointment_date','المسمى الوظيفي':'job_title','الدرجة':'employment_grade','employment_grade':'employment_grade','تاريخ استلام العمل':'work_start_date','work_start_date':'work_start_date','الموقف':'assignment_status','assignment_status':'assignment_status','':'school_type','school_type':'school_type','النوع':'gender_type','gender_type':'gender_type','العنوان':'address','address':'address','عدد الفصول':'class_count','class_count':'class_count','جهة الاعتماد':'approval_authority','approval_authority':'approval_authority'};return map[x]||x}
async function uxEnsureXlsx(){if(window.XLSX)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('تعذر تحميل قارئ Excel'));document.head.appendChild(s)})}

async function openPaidShortageCenter(){
 if(!activeTerm?.id||!activeYear?.id)return toast('لا توجد فترة دراسية نشطة.');
 const {data:schools,error}=await sb.from('school_official_staffing').select('*').eq('term_id',activeTerm.id).order('school_name');if(error)return moneySafeError(error);
 if(!(schools||[]).length)return toast('لا توجد مدارس متاحة.');
 const opts=(schools||[]).map(s=>`<option value="${s.school_id}">${esc(s.school_name)} — عجز ${s.official_shortage_periods}</option>`).join('');
 modal(`<h3>توزيع العجز — للموجّه</h3><div class="notice info">العجز الرسمي لا يتغير هنا. ما تسجله هو حصص إضافية بالأجر يأخذها المعلمون الأساسيون من العجز، والباقي فقط يُعلن لمعلمي الأجر.</div><div class="field"><label>المدرسة</label><select id="paidShortageSchool" onchange="loadPaidShortageSchool(this.value)">${opts}</select></div><div id="paidShortageBody"><div class="muted">جارٍ التحميل...</div></div><div class="actions"><button class="btn secondary" onclick="openReportById('officialShortageAdmin')">تقرير الإدارة</button><button class="btn secondary" onclick="openReportById('internalShortage')">تقرير الموجّه</button><button class="btn danger" onclick="closeModal()">إغلاق</button></div>`);
 await loadPaidShortageSchool(schools[0].school_id);
}
async function loadPaidShortageSchool(schoolId){
 const body=document.getElementById('paidShortageBody');if(!body)return;
 body.innerHTML='<div class="muted">جارٍ التحميل...</div>';
 const [sr,tr,ar]=await Promise.all([
  sb.from('school_official_staffing').select('*').eq('school_id',schoolId).eq('term_id',activeTerm.id).maybeSingle(),
  sb.from('teacher_official_staffing').select('teacher_id,full_name,job_title,weekly_target,supervision_periods,official_teaching_periods,suggested_paid_periods').eq('home_school_id',schoolId).eq('work_type','permanent').order('full_name'),
  sb.from('teacher_paid_shortage_allocations').select('teacher_id,paid_periods,note').eq('school_id',schoolId).eq('term_id',activeTerm.id)
 ]);
 if(sr.error||tr.error||ar.error){body.innerHTML=`<div class="notice danger">${esc(sr.error?.message||tr.error?.message||ar.error?.message||'تعذر التحميل')}</div>`;return}
 const s=sr.data||{},alloc=new Map((ar.data||[]).map(x=>[x.teacher_id,x]));
 const rows=(tr.data||[]).map(t=>{const a=alloc.get(t.teacher_id),v=Number(a?.paid_periods||0);return `<tr><td><b>${esc(t.full_name)}</b><br><small>${esc(t.job_title||'')}</small></td><td>${t.weekly_target??'—'}</td><td>${t.supervision_periods||0}</td><td><b>${t.official_teaching_periods}</b></td><td>${t.suggested_paid_periods}</td><td><input class="paid-shortage-input" data-teacher-id="${t.teacher_id}" type="number" min="0" max="24" step="1" value="${v}" style="width:74px;text-align:center" oninput="recalcPaidShortagePreview()"></td><td class="paid-total-cell" data-teacher-id="${t.teacher_id}">${Number(t.official_teaching_periods)+v}</td></tr>`}).join('');
 body.innerHTML=`<div class="grid4" style="margin:10px 0"><div class="card stat-card"><div class="stat-label">الحصص الكلية</div><div class="stat-value">${s.total_required_periods||0}</div></div><div class="card stat-card"><div class="stat-label">الفعلي من الأنصبة</div><div class="stat-value">${s.official_teaching_periods||0}</div></div><div class="card stat-card"><div class="stat-label">العجز الرسمي</div><div class="stat-value" id="paidOfficialShortage">${s.official_shortage_periods||0}</div></div><div class="card stat-card"><div class="stat-label">المتبقي لمعلمي الأجر</div><div class="stat-value" id="paidRemainingPreview">${s.remaining_paid_teacher_periods||0}</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>المعلم</th><th>النصاب</th><th>إشراف</th><th>الفعلي الرسمي</th><th>اقتراح الأجر</th><th>أجر من العجز</th><th>إجمالي التدريس</th></tr></thead><tbody>${rows}</tbody></table></div><div class="notice" id="paidShortagePreviewNote"></div><div class="actions"><button class="btn primary" onclick="savePaidShortageAllocations('${schoolId}')">حفظ توزيع العجز</button><button class="btn secondary" onclick="applySuggestedPaidShortage()">تطبيق الاقتراحات</button></div>`;
 window.__paidShortageTeachers=(tr.data||[]);recalcPaidShortagePreview();
}
function recalcPaidShortagePreview(){
 const shortage=Number(document.getElementById('paidOfficialShortage')?.textContent||0);let used=0;
 document.querySelectorAll('.paid-shortage-input').forEach(i=>{const v=Math.max(0,Number(i.value||0));used+=v;const t=(window.__paidShortageTeachers||[]).find(x=>x.teacher_id===i.dataset.teacherId);const c=document.querySelector(`.paid-total-cell[data-teacher-id="${i.dataset.teacherId}"]`);if(c&&t)c.textContent=Number(t.official_teaching_periods||0)+v});
 const rem=Math.max(shortage-used,0),r=document.getElementById('paidRemainingPreview'),n=document.getElementById('paidShortagePreviewNote');if(r)r.textContent=rem;if(n){n.className='notice '+(used>shortage?'danger':'info');n.textContent=`العجز الرسمي ${shortage} — أخذ المعلمون الأساسيون بالأجر ${used} — المتبقي لمعلمي الأجر ${rem}${used>shortage?' — لا يمكن الحفظ لأن التوزيع تجاوز العجز الرسمي.':''}`}
}
function applySuggestedPaidShortage(){document.querySelectorAll('.paid-shortage-input').forEach(i=>{const t=(window.__paidShortageTeachers||[]).find(x=>x.teacher_id===i.dataset.teacherId);if(t)i.value=Number(t.suggested_paid_periods||0)});recalcPaidShortagePreview()}
async function savePaidShortageAllocations(schoolId){
 const shortage=Number(document.getElementById('paidOfficialShortage')?.textContent||0),items=[];let total=0;
 document.querySelectorAll('.paid-shortage-input').forEach(i=>{const n=Math.max(0,Math.floor(Number(i.value||0)));total+=n;if(n>0)items.push({teacher_id:i.dataset.teacherId,paid_periods:n})});
 if(total>shortage)return toast(`لا يمكن الحفظ: ${total} أكبر من العجز الرسمي ${shortage}.`);
 const btn=document.activeElement;if(btn instanceof HTMLButtonElement){btn.disabled=true;btn.textContent='جارٍ الحفظ...'}
 try{const {data,error}=await sb.rpc('replace_school_paid_shortage_allocations',{p_school_id:schoolId,p_academic_year_id:activeYear.id,p_term_id:activeTerm.id,p_items:items});if(error)return moneySafeError(error);invalidateData('page:reports','dashboard','teachers');toast(`تم الحفظ. المتبقي لمعلمي الأجر: ${data?.remaining_paid_teacher_periods??Math.max(shortage-total,0)} حصة`);await loadPaidShortageSchool(schoolId)}finally{if(btn instanceof HTMLButtonElement){btn.disabled=false;btn.textContent='حفظ توزيع العجز'}}
}

const FINANCIAL_REPORT_ROLES=['admin','first_supervisor','stage_coordinator','supervisor'];
function canViewFinancialGuidanceReport(){return FINANCIAL_REPORT_ROLES.includes(profile?.role)}
function financialLeaveStatusText(row,withType=true){
 const type=withType&&row?.leave_type?` — ${row.leave_type}`:'';
 if(row?.leave_status==='pending_renewal')return `بانتظار التجديد${type}`;
 if(row?.leave_status==='renewed')return `إجازة مجددة${type}`;
 if(row?.leave_status==='returned')return `عاد للعمل${type}`;
 return 'على قوة العمل';
}
function financialLeaveStatusBadge(row){
 const cls=row?.leave_status==='renewed'?'danger':row?.leave_status==='pending_renewal'?'warn':row?.leave_status==='returned'?'ok':'info';
 return `<span class="badge ${cls}">${esc(financialLeaveStatusText(row))}</span>`;
}
function formatFinancialGuidanceReport(sourceRows,ctx){
 const rows=(sourceRows||[]).map((r,index)=>({
  index:index+1,
  name:reportCellValue(r.full_name),
  civil:reportCellValue(r.civil_id),
  school:reportCellValue(r.school_name),
  job:reportCellValue(r.job_title),
  status:financialLeaveStatusText(r),
  legal:reportNumber(r.legal_quota),
  financial:reportNumber(r.financial_teaching_quota),
  supervision:reportNumber(r.supervision_periods),
  total:reportNumber(r.financial_total),
  leaveCode:reportCellValue(r.leave_status),
  _school:reportCellValue(r.school_name),
  _stage:reportCellValue(r.stage),
  _status:financialLeaveStatusText(r),
  _search:[r.full_name,r.civil_id,r.school_name,r.job_title,r.leave_type,financialLeaveStatusText(r)].filter(Boolean).join(' ')
 }));
 const pending=rows.filter(r=>r.leaveCode==='pending_renewal').length;
 const renewed=rows.filter(r=>r.leaveCode==='renewed').length;
 return makeReportSchema({
  reportId:'financialGuidance',
  title:'تقرير التوجيه المالي للمعلمين',
  subtitle:'يحسب النصاب القانوني ماليًا فقط: النصاب المالي = النصاب القانوني − حصتي الإشراف، والمجموع = النصاب المالي + الإشراف. لا تدخل الحصص الفعلية بالجدول أو إسنادات الفصول أو حصص الأجر في هذا التقرير.',
  period:ctx.period,
  summary:[
   reportMetric('المعلمون الأساسيون',rows.length),
   reportMetric('بانتظار التجديد',pending),
   reportMetric('إجازة مجددة',renewed),
   reportMetric('إجمالي النصاب المالي',reportSum(rows,'financial')),
   reportMetric('إجمالي الإشراف',reportSum(rows,'supervision')),
   reportMetric('الإجمالي المالي',reportSum(rows,'total'))
  ],
  columns:[
   reportColumn('index','م',.34,{numeric:true}),
   reportColumn('name','المعلم',1.55),
   reportColumn('civil','الرقم المدني',1.12,{id:true,nowrap:true}),
   reportColumn('school','المدرسة',1.55),
   reportColumn('job','الدرجة الوظيفية',.9),
   reportColumn('status','الحالة / الإجازة',1.35),
   reportColumn('legal','النصاب القانوني',.72,{numeric:true}),
   reportColumn('financial','النصاب المالي',.72,{numeric:true}),
   reportColumn('supervision','الإشراف',.55,{numeric:true}),
   reportColumn('total','المجموع',.6,{numeric:true})
  ],
  rows,
  totals:[
   reportTotalsMetric('المعلمون',rows.length),
   reportTotalsMetric('النصاب المالي',reportSum(rows,'financial')),
   reportTotalsMetric('الإشراف',reportSum(rows,'supervision')),
   reportTotalsMetric('الإجمالي',reportSum(rows,'total'))
  ],
  issuer:ctx.issuer
 });
}

async function financialLeaveTeacherChanged(){
 const id=document.getElementById('financialLeaveTeacher')?.value,row=(window.__financialLeaveRows||[]).find(x=>x.teacher_id===id);
 const current=document.getElementById('financialLeaveCurrent');
 if(!row){if(current)current.textContent='اختر معلمًا لعرض حالته المالية.';return}
 document.getElementById('financialLeaveType').value=row.leave_type||'';
 document.getElementById('financialLeaveStatus').value=row.leave_status==='working'?'':row.leave_status;
 document.getElementById('financialLeaveDecisionNumber').value=row.decision_number||'';
 document.getElementById('financialLeaveDecisionDate').value=row.decision_date||'';
 document.getElementById('financialLeaveFrom').value=row.effective_from||'';
 document.getElementById('financialLeaveTo').value=row.effective_to||'';
 document.getElementById('financialLeaveNotes').value=row.notes||'';
 if(current)current.innerHTML=`<b>${esc(row.full_name)}</b> — <span style="direction:ltr;display:inline-block">${esc(row.civil_id)}</span><br>${financialLeaveStatusBadge(row)} • النصاب القانوني <b>${reportNumber(row.legal_quota)}</b> • النصاب المالي <b>${reportNumber(row.financial_teaching_quota)}</b> • الإشراف <b>${reportNumber(row.supervision_periods)}</b> • المجموع <b>${reportNumber(row.financial_total)}</b>${row.leave_status_source==='carried_forward'?'<br><small>الحالة رُحلت تلقائيًا من إجازة مجددة في عام سابق وأصبحت بانتظار التجديد.</small>':''}`;

}
async function financialLeaveToggleRenewal(){
 const status=document.getElementById('financialLeaveStatus')?.value,isRenewed=status==='renewed';
 document.querySelectorAll('.financial-renewal-only').forEach(x=>x.style.display=isRenewed?'flex':'none');
 const box=document.getElementById('financialLeaveReplacement');if(!box)return;box.innerHTML='';
 const teacherId=document.getElementById('financialLeaveTeacher')?.value,row=(window.__financialLeaveRows||[]).find(x=>x.teacher_id===teacherId);
 if(!isRenewed||!row?.is_senior_teacher)return;
 box.innerHTML='<div class="notice warn">جارٍ تحديد أصحاب الأولوية التالية للإشراف...</div>';
 const {data,error}=await sb.rpc('get_teacher_leave_replacement_candidates',{p_teacher_id:teacherId,p_academic_year_id:activeYear.id});
 if(document.getElementById('financialLeaveTeacher')?.value!==teacherId||document.getElementById('financialLeaveStatus')?.value!=='renewed')return;
 if(error){box.innerHTML=`<div class="notice danger">${esc(error.message||'تعذر تحميل أولوية الإشراف')}</div>`;return}

 });

buildOperationalSchoolPlanData=function(input={}){
 const schools=(input.schools||[]).filter(s=>input.includeAllStages!==false||s.stage==='إعدادي');
 const classes=input.classes||[],teachers=(input.teachers||[]).filter(t=>t.active!==false),rules=input.rules||[],assignments=input.assignments||[];
 const scopeRows=(input.schoolTeacherRosters||input.school_teacher_rosters||[]).filter(t=>t.active!==false);
 const classesBySchool={},teachersBySchool={},classToSchool={};
 classes.forEach(row=>{classToSchool[row.id]=row.school_id;(classesBySchool[row.school_id] ||= []).push(row)});
 if(scopeRows.length)scopeRows.forEach(row=>{const id=v91ScopeSchoolId(row);if(id)(teachersBySchool[id] ||= []).push(row)});
 else teachers.forEach(row=>{if(row.home_school_id)(teachersBySchool[row.home_school_id] ||= []).push(row)});
