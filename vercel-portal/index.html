  async function stepOk(step, box) {
    clearInvalid();
    if (step === 1) {
      var name = pv('full_name');
      if (name.length < 6 || name.split(' ').length < 2) { setInvalid('f_full_name', 'اكتب الاسم الكامل.'); return false; }
      if ((S.mode === 'new' || S.mode === 'sup_new') && digits(S.person.civil_id).length !== 14) { setInvalid('f_civil_id', 'الرقم المدني يجب أن يكون 14 رقمًا.'); return false; }
      var ph = normPhone(S.person.phone);
      var okPhone = /^01[0125][0-9]{8}$/.test(ph) || (S.mode === 'registered' && ph !== '' && ph === normPhone(S.base.phone)) || (S.mode === 'sup_edit' && ph === '');
      if (!okPhone) { setInvalid('f_phone', 'اكتب رقم الهاتف كاملًا (11 رقمًا يبدأ بـ 01).'); return false; }
      S.person.phone = ph;
      var em = pv('email');
      if (em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { setInvalid('f_email', 'البريد الإلكتروني غير صحيح.'); return false; }
      var tcv = digits(S.person.teacher_code || '');
      if (!isSup() && tcv && !/^[0-9]{6,8}$/.test(tcv)) { setInvalid('f_teacher_code', 'كود المعلم من 6 إلى 8 أرقام.'); return false; }
      if ((S.mode === 'new' || S.mode === 'sup_new') && !S.person.work_type) { var er = document.getElementById('err_wt'); er.textContent = 'اختر نوع العمل.'; er.classList.add('on'); return false; }
      var qy = pv('qualification_year');
      if (qy && (!/^[0-9]{4}$/.test(qy) || +qy < 1960 || +qy > new Date().getFullYear())) { setInvalid('f_qualification_year', 'اكتب سنة صحيحة من 4 أرقام.'); return false; }
      var dts = ['appointment_date', 'grade_acquired_date', 'work_start_date'];
      for (var i = 0; i < dts.length; i++) {
        var v = pv(dts[i]); if (!v) continue;
        var t = Date.parse(v);
        if (isNaN(t) || t < Date.parse('1970-01-01') || t > Date.now() + 366 * 864e5) { setInvalid('f_' + dts[i], 'تاريخ غير صحيح.'); return false; }
      }
    }
    if (step === 2 && !S.school) { showErr(box, 'اختر مدرستك أولًا.'); return false; }
    if (!isSup() && S.school && stepKey(step) === 'classes') {
      var cl = S.cache[S.school.id] || [], miss = [];
      cl.forEach(function (c) { if (S.sel.has(c.id) && needSubject(c) && !S.subj.get(c.id)) miss.push(c.label); });
      if (miss.length) { showErr(box, 'اختر المادة التي تدرّسها في: ' + miss.join('، ') + '.'); return false; }
    }
    if (!isSup() && stepKey(step) === 'classes' && !hasDeleg() && S.sel.size === 0) { showErr(box, 'لا يمكن إرسال الطلب بدون فصول. اختر فصلًا واحدًا على الأقل من الفصول غير المسندة.'); return false; } // v2.0
    return true;
  }

  /* الخطوة 2: المدرسة */

        h('span', null, '✓ ', h('strong', null, S.school.name)),
        h('button', { type: 'button', class: 'link', onclick: function () { S.school = null; S.sel = new Map(); saveDraft(); drawPicked(); drawList(); } }, 'تغيير')));
    }
    function drawChips() {
      chips.replaceChildren();
      var closedSt = (S.mode === 'new' && S.status && S.status.closed_stages) || {};
      if (closedSt[S.stageKey]) { S.stageKey = null; S.school = null; S.sel = new Map(); }
      STAGES.forEach(function (s) {
        if (closedSt[s.k]) return;
        chips.appendChild(h('button', { type: 'button', class: 'chip', 'data-stage': s.k, 'aria-pressed': S.stageKey === s.k ? 'true' : 'false', onclick: function () {

        } }, s.t));
      });

      });
    }
    function drawList() {
      list.replaceChildren();

      list.style.display = ''; q.style.display = '';
      if (!S.stageKey) { list.appendChild(h('div', { class: 'empty' }, 'اختر المرحلة أولًا')); return; }
      if (!S.schools) { list.appendChild(h('div', { class: 'empty' }, 'جارٍ تحميل المدارس...')); return; }
      var toks = arNorm(S.q).split(' ').filter(Boolean);
      var res = S.schools.filter(function (s) {
        if (s.stage_key !== S.stageKey) return false;
        var n = arNorm(s.name); return toks.every(function (t) { return n.indexOf(t) >= 0; });
      });

      res.forEach(function (s) {

          S.school = { id: s.id, name: s.name, stage_key: s.stage_key }; S.q = ''; q.value = '';
          if (S.school.id !== S.baseSchoolId && S.mode === 'registered') S.sel = new Map(); else if (S.mode === 'registered') S.sel = new Map(S.sel.size ? S.sel : S.baseSel);

    q.addEventListener('input', function () { S.q = q.value; drawList(); });
    body.appendChild(h('div', { class: 'fg' }, h('label', null, 'المرحلة التي تعمل بها'), chips));
    body.appendChild(picked); body.appendChild(q); body.appendChild(list);

  /* المواد داخل الفصل (الثانوي): يحتاج اختيار مادة إذا كان للفصل أكثر من مادة ولم يكن مسندًا للمعلم أصلًا */
  function subsOf(c) { return c.subjects || []; }
  function needSubject(c) { return !isSup() && subsOf(c).length > 1 && !S.baseSel.has(c.id); }
  function subjFree(x) { return !(x.taken_by || x.pending_by); }

  /* الخطوة 3: الفصول */
  function renderStep3(body, box) {
    if (!S.school) {
      body.appendChild(h('div', { class: 'warn' }, 'اختر المدرسة أولًا ثم ارجع لاختيار الفصول.'));
      body.appendChild(mkBtn('btn2', 'اختيار المدرسة', function () { S.step = 2; render(); }));
      return;
    }
    var holder = h('div', { id: 'classes-holder' }, h('div', { class: 'sub' }, 'جارٍ تحميل فصول المدرسة...'));
    body.appendChild(h('div', { class: 'note' }, isSup() ? 'اضغط على الفصول التي يدرّس لها المعلم مادة العلوم في ' + S.school.name + '.'
      : 'اضغط على الفصول التي تدرّس لها مادة العلوم، من فصول ' + S.school.name + '.'));
    body.appendChild(holder);
    loadClasses(S.school.id, true).then(function (list) {
      holder.replaceChildren();
      if (!list.length) { holder.appendChild(h('div', { class: 'warn' }, 'لا توجد فصول مسجّلة لهذه المدرسة بعد، ولا يمكن إرسال الطلب بدون فصول. تواصل مع منسق المرحلة لإضافة فصول المدرسة.')); return; }
      var known = {}; list.forEach(function (c) { known[c.id] = c; });
      // v2.0: الفصل المسند لمعلم آخر (أو عليه طلب معلّق لغيره) لا يُختار في كل المسارات؛ فصول المعلم نفسه مستثناة
      function lockedFor(c) { return c.locked === true && !S.baseSel.has(c.id); }
      var dropped = [];
      Array.from(S.sel.keys()).forEach(function (id) {
        if (!known[id]) S.sel.delete(id);
        else if (lockedFor(known[id])) { dropped.push(known[id].label); S.sel.delete(id); }
      });
      // مادة محفوظة في المسودة أصبحت محجوزة: تُمسح ليختار المعلم غيرها
      Array.from(S.subj.keys()).forEach(function (id) {
        var c = known[id], sj = c && subsOf(c).filter(function (x) { return x.subject_id === S.subj.get(id); })[0];
        if (!c || !S.sel.has(id) || !needSubject(c) || !sj || !subjFree(sj)) S.subj.delete(id);
      });
      var grid = h('div', { id: 'grid' }), sum = h('div', { id: 'sum' });
      function draw() {
        grid.replaceChildren();
        var groups = [], idx = {};
        list.forEach(function (c) { if (!(c.grade_label in idx)) { idx[c.grade_label] = groups.length; groups.push({ t: c.grade_label, items: [] }); } groups[idx[c.grade_label]].items.push(c); });
        groups.forEach(function (g) {
          grid.appendChild(h('div', { class: 'grade' }, g.t));
          grid.appendChild(h('div', { class: 'chips' }, g.items.map(function (c) {
            var on = S.sel.has(c.id);
            if (lockedFor(c)) return h('button', { type: 'button', class: 'chip locked', disabled: true, 'aria-disabled': 'true', 'data-class': c.id, 'data-locked': '1' },
              c.class_label, h('small', null, (c.taken_by || []).length ? 'مسندة لـ ' + c.taken_by.join('، ')
                : (c.pending_by || []).length ? 'طلب معلّق لـ ' + c.pending_by.join('، ') + ' (بانتظار الاعتماد)' : 'مسندة لمعلم آخر'));
            return h('button', { type: 'button', class: 'chip', 'data-class': c.id, 'aria-pressed': on ? 'true' : 'false', onclick: function () {
              if (S.sel.has(c.id)) { S.sel.delete(c.id); S.subj.delete(c.id); }
              else {
                S.sel.set(c.id, S.baseSel.get(c.id) || c.periods);
                if (needSubject(c)) { var fr = subsOf(c).filter(subjFree); if (fr.length === 1) S.subj.set(c.id, fr[0].subject_id); }
              }
              S._noClassOk = false; saveDraft(); draw();
            } }, (on ? '✓ ' : '') + c.class_label);
          })));
        });
        sum.replaceChildren();
        sum.appendChild(h('h2', { style: 'margin-top:18px' }, (isSup() ? 'فصول المعلم (' : 'فصولي (') + S.sel.size + ')'));
        if (!S.sel.size) sum.appendChild(h('div', { class: 'sub', style: 'text-align:right' }, (isSup() ? 'لم تُختر أي فصل بعد.' : 'لم تختر أي فصل بعد.')));
        list.forEach(function (c) {
          if (!S.sel.has(c.id)) return;
          var row = h('div', { class: 'sel', 'data-sel': c.id }, h('span', { class: 'nm' }, c.label));
          if (c.periods > 1) {
            var sl = h('select', { 'aria-label': 'عدد الحصص' }, Array.from({ length: c.periods }, function (_, i) { return h('option', { value: String(i + 1) }, perLabel(i + 1)); }));
            sl.value = String(S.sel.get(c.id)); sl.addEventListener('change', function () { S.sel.set(c.id, +sl.value); saveDraft(); draw(); });
            row.appendChild(sl);
          } else row.appendChild(h('span', { class: 'sub', style: 'margin:0' }, '1 حصة'));
          row.appendChild(h('button', { type: 'button', class: 'x', 'aria-label': 'إزالة', onclick: function () { S.sel.delete(c.id); S.subj.delete(c.id); saveDraft(); draw(); } }, '✕'));
          sum.appendChild(row);

            var sbs = h('select', { 'aria-label': 'المادة', 'data-subj': c.id, style: 'width:100%' }, h('option', { value: '' }, '— اختر المادة التي تدرّسها —'),
              subsOf(c).map(function (x) {
                return h('option', { value: x.subject_id, disabled: !subjFree(x) },
                  x.name + (x.taken_by ? ' (مسندة لـ ' + x.taken_by + ')' : x.pending_by ? ' (طلب معلّق لـ ' + x.pending_by + ')' : ''));
              }));

            sum.appendChild(h('div', { class: 'fg', style: 'margin:2px 0 10px' }, sbs,

          }
          if (isSup()) {
            var tot = (c.assigned || 0) - (S.baseSel.get(c.id) || 0) + S.sel.get(c.id);
            if (tot > c.periods) sum.appendChild(h('div', { class: 'warn over', 'data-over': c.id, style: 'margin:4px 0 8px;font-size:.82rem' },

      }
      if (dropped.length) holder.appendChild(h('div', { class: 'warn', id: 'dropped-note' }, 'أُزيلت من اختيارك فصول أصبحت مسندة لمعلم آخر: ' + dropped.join('، ') + '.'));
      if (list.some(lockedFor)) holder.appendChild(h('div', { class: 'note', id: 'locked-note' }, 'الفصول المعطّلة مسندة حاليًا لمعلمين آخرين ولا يمكن اختيارها. إن كان الإسناد غير صحيح فراجع المعلم المذكور ليطلب إلغاء إسناده، أو تواصل مع المنسق لتعديل الإسناد بين المعلمين.'));
      holder.appendChild(grid); holder.appendChild(sum); draw();

    wrap.appendChild(h('div', { class: 'stlabel', id: 'stlabel' }, SUP_T[key]));
    if (S.supVisitor && S.sstep === 0) wrap.appendChild(h('div', { class: 'note', id: 'visitor-note' }, 'هذا المعلم منتدب إلى مدرستك، فيمكنك تعديل فصوله في ' + S.school.name + ' فقط.'));
    if (S.closed) wrap.appendChild(closedBanner());
    if (S.draft && S.sstep === 0) {
      var d = S.draft;
      wrap.appendChild(h('div', { class: 'warn', id: 'draft-note' }, 'لديك مسودة غير مرسلة لمعلم جديد محفوظة على هذا الجهاز. ',
        h('button', { type: 'button', class: 'link', id: 'draft-restore', onclick: function () { restoreDraft(d); S.draft = null; S.sstep = Math.min(d.step || 0, n - 1); render(); } }, 'متابعة المسودة'), ' · ',
        h('button', { type: 'button', class: 'link', id: 'draft-drop', onclick: function () { dropDraft(dkey()); S.draft = null; render(); } }, 'تجاهلها')));
    }
    var body = h('div', { id: 'stepbody' }), box = errbox();
    wrap.appendChild(body); wrap.appendChild(box);
    var nav = h('div', { class: 'row' });
    if (S.sstep > 0) nav.appendChild(mkBtn('btn2', 'السابق', function () { S.sstep--; saveDraft(); render(); }, { id: 'btn-prev' }));
    if (S.sstep < n - 1) nav.appendChild(mkBtn('btn', 'التالي', async function () {
      hideErr(box);
      if (key === 'classes' && S.sel.size === 0) { showErr(box, 'لا يمكن الإرسال بدون فصول. اختر للمعلم فصلًا واحدًا على الأقل من الفصول غير المسندة.'); return; } // v2.0
      if (key !== 'person' || await stepOk(1, box)) { S.sstep++; saveDraft(); render(); }
    }, { id: 'btn-next' }));
    else nav.appendChild(mkBtn('btn-ok', 'إرسال للاعتماد', async function (ev) {
      hideErr(box);
      if (S.closed) { showErr(box, reasonMsg({ reason: 'closed' })); return; }
      if (S.sel.size === 0) { showErr(box, 'لا يمكن الإرسال بدون فصول. اختر للمعلم فصلًا واحدًا على الأقل من الفصول غير المسندة.'); return; } // v2.0
      var b = ev.currentTarget; btnBusy(b, true, 'جارٍ الإرسال...');
      try { await doSupSubmit(box); } catch (e) { showErr(box, errMsg(e)); }
      if (document.body.contains(b)) btnBusy(b, false);
    }, { id: 'btn-submit' }));
    wrap.appendChild(nav);
    if (isNew) wrap.appendChild(h('p', { class: 'sub', style: 'margin-top:12px;font-size:.8rem' }, 'تُحفظ المسودة تلقائيًا على هذا الجهاز.'));
    ({ person: renderStep1, classes: renderStep3, review: renderStep4 })[key](body, box);
    return wrap;
  };

  async function doSupSubmit(box) {
    if (S.busy) return; S.busy = true;
    try {
      var isNew = S.mode === 'sup_new', pl = buildPayload(false), person = S.supVisitor ? {} : pl.person;
      if (isNew) { person.work_type = S.person.work_type; person.civil_id = digits(S.person.civil_id); }
      var r = await rpc('teacher_portal_sup_submit', {
        p_civil: S.sup.auth.civil, p_phone: S.sup.auth.phone, p_code: S.sup.auth.code, p_kind: isNew ? 'new' : 'update',
        p_teacher_id: isNew ? null : S.sup.t.id, p_school_id: S.sup.school.id,
        p_payload: { person: person, classes: pl.classes } });
      if (!r || r.ok !== true) { r = r || {}; r.sup = true; showErr(box, reasonMsg(r)); return; }
      if (isNew) dropDraft(dkey());
      S.result = r; S.supName = isNew ? pv('full_name') : S.sup.t.full_name; go('supdone');
    } finally { S.busy = false; }
  }

  VIEWS.supdone = function () {
    var r = S.result || {}, box = errbox();
    return h('div', { class: 'card' }, h('div', { class: 'ok-screen' },
      h('div', { class: 'ok-ic' }, '✓'),
      h('h2', null, r.kind === 'new' ? 'تم إرسال طلب إضافة المعلم' : 'تم إرسال التعديلات'),
      h('p', null, (S.supName ? S.supName + ' — ' : '') + 'ستراجعها إدارة التوجيه وتظهر في البرنامج بعد اعتمادها.'),
      h('div', { class: 'refno', id: 'refno' }, r.ref || ''),
      box,
      mkBtn('btn', 'العودة لمعلمي المدرسة', async function (ev) {
        hideErr(box); var b = ev.currentTarget; btnBusy(b, true, 'لحظة...');
        try { await openSchool(S.sup.school.id); } catch (e) { showErr(box, errMsg(e)); btnBusy(b, false); }
      }, { id: 'btn-back-school' }),
      h('div', { style: 'height:10px' }),
      mkBtn('btn2', 'الرئيسية', goHome, { id: 'btn-home' })));
  };

  /* ---------- v376: الفصول والمجموعات — إسناد وإلغاء إسناد (مشرف المدرسة / مسؤول البيانات) ---------- */
  function asgAuth() { var a = S.sup.auth; return { p_civil: a.civil, p_phone: a.phone, p_school_id: S.sup.school.id }; }
  async function asgLoad() {
    var r = await rpc('teacher_portal_assign_board', asgAuth());
    if (!r || r.ok !== true) throw (r || { reason: 'x' });
    return r;
  }
  function asgMsg(r) {
    if (r && r.reason === 'closed') return 'إسناد الفصول مغلق حاليًا.';
    if (r && r.reason === 'taken') return 'هذا الفصل أُسند بالفعل لمعلم آخر. تم تحديث القائمة.';
    if (r && typeof r.reason === 'string' && /[؀-ۿ]/.test(r.reason)) return r.reason;
    return errMsg(r);
  }
  function asgTileNo(t, multi) { var m = /(\d+)\s*$/.exec(t.class_label || ''); return (!multi && m) ? m[1] : (t.class_label || ''); }

  VIEWS.supassign = function () {
    var A = S.asg, box = errbox(), host = h('div', { id: 'asg-host' }), sheet = h('div', { id: 'asg-sheet' });
    function find(t) { var r = null; A.data.classes.forEach(function (x) { if (x.class_id === t.class_id && x.subject_id === t.subject_id) r = x; }); return r; }
    function closeSheet() { sheet.replaceChildren(); }
    async function reload() { A.data = await asgLoad(); paint(); }
    function multiOf(t) { return A.data.classes.filter(function (x) { return x.class_id === t.class_id; }).length > 1; }
    function tileTitle(t) { return (t.grade_label || '').replace(/\s+(الابتدائي|الإعدادي|الثانوي).*$/, '') + ' — ' + (t.class_label || '') + (t.subject_name && multiOf(t) ? ' — ' + t.subject_name : ''); }

    function showAssigned(t) {
      var sb = errbox();
      var cancel = mkBtn('asg-danger', 'إلغاء الإسناد', async function (ev) {
        hideErr(sb); var b = ev.currentTarget; btnBusy(b, true, 'جارٍ الإلغاء...');
        try {
          var r = await rpc('teacher_portal_sup_unassign', Object.assign(asgAuth(), { p_assignment_id: t.assignment_id }));
          if (!r || r.ok !== true) { r = r || {}; showErr(sb, asgMsg(r)); if (r.reason === 'gone') await reload(); btnBusy(b, false); return; }
          await reload();
          var nt = find(t); if (nt && !nt.assignment_id) showPicker(nt, true); else closeSheet();
        } catch (e) { showErr(sb, asgMsg(e)); btnBusy(b, false); }
      }, { id: 'asg-cancel' });
      sheet.replaceChildren(h('div', { class: 'asg-ov', onclick: closeSheet }),
        h('div', { class: 'asg-sheet', id: 'asg-panel' },
          h('h3', null, tileTitle(t)),
          h('p', { class: 'sub', style: 'text-align:right' }, 'المعلم المسند: ' + (t.teacher_name || '')),
          t.slots > 0 ? h('div', { class: 'warn' }, 'إلغاء الإسناد سيزيل ' + perLabel(t.slots) + ' من جدول هذا المعلم لهذا الفصل.') : null,
          sb, cancel, h('div', { style: 'height:8px' }), mkBtn('btn2', 'إغلاق', closeSheet, { id: 'asg-close' })));
    }

    function showPicker(t, afterCancel) {
      var sb = errbox(), q = h('input', { type: 'text', id: 'asg-q', placeholder: 'ابحث باسم المعلم', autocomplete: 'off' }), list = h('div', { class: 'list', id: 'asg-teachers' });
      function draw() {
        list.replaceChildren();
        var toks = arNorm(q.value).split(' ').filter(Boolean);
        var res = A.data.teachers.filter(function (x) { var n = arNorm(x.full_name); return toks.every(function (tk) { return n.indexOf(tk) >= 0; }); });
        if (!res.length) { list.appendChild(h('div', { class: 'empty' }, 'لا يوجد معلم بهذا الاسم')); return; }
        res.forEach(function (x) {
          list.appendChild(h('button', { type: 'button', 'data-teacher': x.id, onclick: async function () {
            hideErr(sb); list.querySelectorAll('button').forEach(function (z) { z.disabled = true; });
            try {
              var r = await rpc('teacher_portal_sup_assign', Object.assign(asgAuth(), { p_class_id: t.class_id, p_subject_id: t.subject_id, p_teacher_id: x.id }));
              if (!r || r.ok !== true) {
                r = r || {}; showErr(sb, asgMsg(r));
                if (r.reason === 'taken') { await reload(); closeSheet(); } else list.querySelectorAll('button').forEach(function (z) { z.disabled = false; });
                return;
              }
              closeSheet(); await reload();
            } catch (e) { showErr(sb, asgMsg(e)); list.querySelectorAll('button').forEach(function (z) { z.disabled = false; }); }
          } },
            h('span', null, x.full_name), x.is_home ? null : h('span', { class: 'tag c' }, 'منتدب'),
            h('small', { style: 'display:block;color:var(--muted);font-weight:400' }, [x.specialty, x.load ? perLabel(x.load) + ' هنا' : 'بدون حصص هنا'].filter(Boolean).join(' · '))));
        });
      }
      q.addEventListener('input', draw); draw();
      sheet.replaceChildren(h('div', { class: 'asg-ov', onclick: closeSheet }),
        h('div', { class: 'asg-sheet', id: 'asg-panel' },
          h('h3', null, 'إسناد: ' + tileTitle(t)),
          afterCancel ? h('div', { class: 'note' }, 'أُلغي الإسناد. اختر معلمًا آخر لهذا الفصل، أو أغلق وسيبقى غير مسند.') : null,
          q, list, sb, mkBtn('btn2', 'إغلاق', closeSheet, { id: 'asg-close' })));
    }

    function paint() {
      host.replaceChildren();
      var items = A.data.classes, groups = [], gi = {};
      items.forEach(function (c) { var k = c.grade_label || ''; if (!(k in gi)) { gi[k] = groups.length; groups.push({ label: k, items: [] }); } groups[gi[k]].items.push(c); });
      if (!groups.length) host.appendChild(h('div', { class: 'empty' }, 'لا توجد فصول مقررة لهذه المدرسة.'));
      groups.forEach(function (g) {
        var a = g.items.filter(function (x) { return x.assignment_id; }).length, f = g.items.length - a;
        host.appendChild(h('div', { class: 'asg-card' },
          h('div', { class: 'asg-gh' }, h('b', null, g.label.replace(/\s+(الابتدائي|الإعدادي|الثانوي).*$/, '')), h('span', null, g.items.length + ' فصل • ' + a + ' مسند')),
          h('div', { class: 'asg-body' },
            h('div', { class: 'asg-stat' }, h('span', null, h('b', null, String(a)), ' مسند', f ? [' · ', h('b', { class: 'w' }, String(f)), ' ينتظر الإسناد'] : ' ✔'),
              h('span', { class: 'asg-bar' + (f ? ' part' : '') }, h('i', { style: 'width:' + Math.round(a * 100 / g.items.length) + '%' }))),
            h('div', { class: 'asg-chips' }, g.items.map(function (t) {
              var multi = multiOf(t);
              return h('button', { type: 'button', class: 'asg-chip' + (t.assignment_id ? '' : ' free'), 'data-class': t.class_id, 'data-subject': t.subject_id,
                onclick: function () { hideErr(box); if (t.assignment_id) showAssigned(t); else showPicker(t, false); } },
                h('b', null, asgTileNo(t, multi)),
                h('small', null, (multi && t.subject_name ? t.subject_name + ' · ' : '') + (t.teacher_name || 'غير مسند')));
            })))));
      });
    }
    paint();
    return h('div', { class: 'card' },
      suptop('الفصول والمجموعات', '‹ المعلمون', async function () { try { await openSchool(S.sup.school.id); } catch (e) { go('supschool'); } }),
      h('h2', null, S.sup.school.name),
      A.data.assign_open === false ? h('div', { class: 'warn', id: 'asg-closed' }, 'إسناد الفصول مغلق حاليًا، يمكنك المراجعة فقط.') : null,
      h('p', { class: 'sub', style: 'text-align:right' }, 'اضغط فصلًا مسندًا لإلغاء إسناده، أو فصلًا غير مسند لإسناده لمعلم.'),
      box, host, sheet);
  };

  /* ---------- التشغيل ---------- */
  async function boot() {
    S.statusErr = false;
    try { S.status = await rpc('teacher_portal_status'); } catch (e) { S.statusErr = true; }
    if (S.view === 'login') render();
  }
  if (CFG.trial) document.getElementById('ribbon').appendChild(h('div', { class: 'ribbon' }, 'نسخة تجريبية — لا تُعتمد البيانات إلا بعد مراجعة الإدارة'));
  /* رابط مباشر لشاشة المعلم: …/#teacher (2026-11-01) */
  /* v363: الرابط القديم …/#teacher يفتح شاشة الدخول الموحدة */
  render();
  boot();
})();
</script>
