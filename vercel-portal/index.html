  async function stepOk(step, box) {
    clearInvalid();
    if (step === 1) {
      var name = pv('full_name');
      if (name.length < 6 || name.split(' ').length < 2) { setInvalid('f_full_name', 'اكتب الاسم الكامل.'); return false; }
      if ((S.mode === 'new' || S.mode === 'sup_new') && digits(S.person.civil_id).length !== 14) { setInvalid('f_civil_id', 'الرقم المدني يجب أن يكون 14 رقمًا.'); return false; }
      var ph = normPhone(S.person.phone);
      var okPhone = /^01[0125][0-9]{8}$/.test(ph) || (S.mode === 'registered' && ph !== '' && ph === normPhone(S.base.phone)) || (S.mode === 'sup_edit' && ph === '');
      if (!okPhone) { setInvalid('f_phone', 'اكتب رقم الهاتف كاملًا (11 رقمًا يبدأ بـ 01).'); return false; }
      S.person.phone = ph;
      var em = pv('email');
      if (em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { setInvalid('f_email', 'البريد الإلكتروني غير صحيح.'); return false; }
      if ((S.mode === 'new' || S.mode === 'sup_new') && !S.person.work_type) { var er = document.getElementById('err_wt'); er.textContent = 'اختر نوع العمل.'; er.classList.add('on'); return false; }
      var qy = pv('qualification_year');
      if (qy && (!/^[0-9]{4}$/.test(qy) || +qy < 1960 || +qy > new Date().getFullYear())) { setInvalid('f_qualification_year', 'اكتب سنة صحيحة من 4 أرقام.'); return false; }
      var dts = ['appointment_date', 'grade_acquired_date', 'work_start_date'];
      for (var i = 0; i < dts.length; i++) {
        var v = pv(dts[i]); if (!v) continue;
        var t = Date.parse(v);
        if (isNaN(t) || t < Date.parse('1970-01-01') || t > Date.now() + 366 * 864e5) { setInvalid('f_' + dts[i], 'تاريخ غير صحيح.'); return false; }
      }
    }
    if (step === 2 && !S.school) { showErr(box, 'اختر مدرستك أولًا.'); return false; }
    return true;
  }

    }

      var toks = arNorm(S.q).split(' ').filter(Boolean);

            ln.length ? ln.map(function (x) { return h('div', null, x); }) : 'لا فصول', dChanged(d) ? h('span', { class: 'tag c' }, 'عُدّلت') : null)));
      });
      if (dTotal() > 0) rows.push(h('div', null, h('span', { class: 'k' }, 'إجمالي الحصص مع الانتداب'), h('span', { class: 'v', id: 'rev-total-all' }, String(totalPeriods() + dTotal()))));
    }
    body.appendChild(h('div', { class: 'note' }, isSup() ? 'راجع ما ستُرسله (المعدَّل عليه موضَّح). لا يُطبَّق شيء قبل اعتماد الإدارة.'
      : isNew ? 'راجع بياناتك ثم اضغط «إرسال التسجيل».' : 'راجع تعديلاتك (المعدَّل عليه موضَّح)، ثم اضغط «إرسال التعديلات».'));
    body.appendChild(h('div', { class: 'kv', id: 'review' }, rows));
  }

  /* ---------- مشرف المدرسة (المرحلة 2) ---------- */
  var SUP_T = { person: 'بيانات المعلم', classes: 'الفصول', review: 'المراجعة' };
  function goHome() { var s = S.status, sc = S.schools, ca = S.cache; reset(); S.status = s; S.schools = sc; S.cache = ca; go('launcher'); }
  function suptop(title, backLabel, backFn) {
    return h('div', { class: 'top' }, h('button', { type: 'button', class: 'link', id: 'sup-back', onclick: backFn }, backLabel), h('strong', null, title || ''));
  }
  function closedBanner() { return S.closed ? h('div', { class: 'warn', id: 'closed-banner' }, 'فترة تعديل البيانات مغلقة حاليًا، يمكنك المراجعة فقط.') : null; }
  function wtLabel(w) { return w === 'permanent' ? 'معيّن (دائم)' : w === 'paid' ? 'بالأجر (عقد)' : ''; }
  function supTotal(t) { var n = 0; (t.classes || []).forEach(function (c) { n += c.periods; }); return n; }

  async function openSchool(id) {
    var r = await rpc('teacher_portal_sup_school', { p_civil: S.sup.auth.civil, p_phone: S.sup.auth.phone, p_school_id: id, p_code: S.sup.auth.code });
    if (!r || r.ok !== true) throw (r || { reason: 'x' });
    S.sup.school = r.school; S.sup.classes = r.classes || []; S.sup.teachers = r.teachers || []; S.sup.q = ''; S.sup.t = null;
    S.cache[r.school.id] = S.sup.classes; S.closed = r.editing_open === false; S.mode = 'sup';
    go('supschool');
  }

  VIEWS.supgate = function () {
    var civil = h('input', { type: 'tel', id: 'sg_civil', inputmode: 'numeric', maxlength: '20', autocomplete: 'off', dir: 'ltr' });
    var phone = h('input', { type: 'tel', id: 'sg_phone', inputmode: 'numeric', maxlength: '20', autocomplete: 'off', dir: 'ltr' });
    var code = h('input', { type: 'tel', id: 'sg_code', inputmode: 'numeric', maxlength: '12', autocomplete: 'off', dir: 'ltr' });
    var hintC = h('div', { class: 'hint' }), hintP = h('div', { class: 'hint' }), hintK = h('div', { class: 'hint' }), box = errbox();
    bindDigits(civil, 14, hintC); bindPhone(phone, hintP); bindDigits(code, 12, hintK);
    var btn = mkBtn('btn', 'دخول', null, { type: 'submit', id: 'sg_go' });
    var form = h('form', { novalidate: true, onsubmit: async function (ev) {
      ev.preventDefault(); hideErr(box);
      var c = digits(civil.value), p = normPhone(phone.value), k = digits(code.value);
      if (c.length !== 14) { showErr(box, reasonMsg({ reason: 'bad_civil' })); civil.focus(); return; }
      if (p.length < 10) { showErr(box, reasonMsg({ reason: 'bad_phone' })); phone.focus(); return; }
      btnBusy(btn, true, 'جارٍ التحقق...');
      try {
        var r = await rpc('teacher_portal_sup_login', { p_civil: c, p_phone: p, p_code: k });
        if (!r || r.ok !== true) { r = r || {}; r.sup = true; showErr(box, reasonMsg(r)); btnBusy(btn, false); return; }
        S.sup = { auth: { civil: c, phone: p, code: k }, name: r.name || '', schools: r.schools || [], school: null, classes: [], teachers: [], t: null, q: '' };
        S.closed = r.editing_open === false;
        if (S.sup.schools.length === 1) await openSchool(S.sup.schools[0].id); else go('supschools');
      } catch (e) { showErr(box, errMsg(e)); btnBusy(btn, false); }
    } },
      h('p', { class: 'sub', style: 'text-align:right' }, 'اكتب رقمك المدني ورقم هاتفك المسجّل وكود المعلم الخاص بك في سجل المعلمين، وسنعرض لك معلمي مدرستك (لمشرف المدرسة: أقدم معلم أساسي).'),
      h('div', { class: 'fg' }, h('label', { for: 'sg_civil' }, 'الرقم المدني (القومي)'), civil, hintC),
      h('div', { class: 'fg' }, h('label', { for: 'sg_phone' }, 'رقم الهاتف'), phone, hintP),
      h('div', { class: 'fg' }, h('label', { for: 'sg_code' }, 'كود المعلم'), code, hintK,
        h('div', { class: 'hint', id: 'sg_code_note', style: 'color:var(--muted)' }, 'الكود المسجّل لك في سجل المعلمين. إن لم يكن لك كود مسجّل اتركه فارغًا.')), box, btn);
    return h('div', { class: 'card' }, suptop('مشرف مدرسة', '‹ الرئيسية', goHome), form);
  };

  VIEWS.supschools = function () {
    var list = S.sup.schools, box = errbox();
    return h('div', { class: 'card' }, suptop('مدارسك', '‹ الرئيسية', goHome),
      h('h2', null, 'أهلًا ' + (clean(S.sup.name).split(' ')[0] || '')),
      closedBanner(),
      list.length ? h('p', { class: 'sub', style: 'text-align:right' }, 'اختر المدرسة لعرض معلميها.') : null,
      list.length ? h('div', { class: 'list', id: 'sup-schools', style: 'max-height:none' }, list.map(function (s) {
        return h('button', { type: 'button', 'data-school': s.id, onclick: async function (ev) {
          hideErr(box); var b = ev.currentTarget; b.disabled = true;
          try { await openSchool(s.id); } catch (e) { showErr(box, errMsg(e)); b.disabled = false; }
        } }, h('span', null, s.name), h('small', { style: 'display:block;color:var(--muted);font-weight:400' }, [stageTitle(s.stage_key), s.teachers + ' معلم'].filter(Boolean).join(' · ')));
      })) : h('div', { class: 'warn', id: 'no-schools' }, 'لا توجد مدارس مسندة إليك في النظام. تواصل مع إدارة التوجيه.'), box);
  };

  VIEWS.supschool = function () {
    var sup = S.sup, sch = sup.school;
    var listEl = h('div', { class: 'list', id: 'sup-teachers', style: 'max-height:none' });
    var q = h('input', { type: 'text', id: 'sup-q', placeholder: 'ابحث باسم المعلم أو كوده', autocomplete: 'off', value: sup.q || '' });
    function draw() {
      listEl.replaceChildren();
      var toks = arNorm(sup.q).split(' ').filter(Boolean);
      var res = sup.teachers.filter(function (t) {
        var n = arNorm(t.full_name + ' ' + (t.teacher_code || '') + ' ' + (t.civil_last4 || ''));
        return toks.every(function (tk) { return n.indexOf(tk) >= 0; });
      });
      if (!res.length) { listEl.appendChild(h('div', { class: 'empty' }, sup.teachers.length ? 'لا يوجد معلم بهذا الاسم' : 'لا يوجد معلمون في هذه المدرسة بعد')); return; }
      res.forEach(function (t) {
        var tot = supTotal(t);
        listEl.appendChild(h('button', { type: 'button', 'data-teacher': t.id, onclick: function () { sup.t = t; go('supteacher'); } },
          h('span', null, t.full_name),
          t.is_home ? null : h('span', { class: 'tag c' }, 'منتدب'),
          t.pending ? h('span', { class: 'tag m' }, 'طلبك قيد المراجعة') : null,
          t.teacher_pending ? h('span', { class: 'tag c' }, 'طلب من المعلم') : null,
          h('small', { style: 'display:block;color:var(--muted);font-weight:400' }, tot ? plural(t.classes.length, 'فصل واحد', 'فصلان', 'فصول') + ' · ' + perLabel(tot) + ' أسبوعيًا' : 'بدون فصول مسندة')));
      });
    }
    q.addEventListener('input', function () { sup.q = q.value; draw(); });
    draw();
    return h('div', { class: 'card' },
      suptop(sch.name, sup.schools.length > 1 ? '‹ المدارس' : '‹ الرئيسية', sup.schools.length > 1 ? function () { go('supschools'); } : goHome),
      h('p', { class: 'sub', style: 'text-align:right' }, stageTitle(sch.stage_key) + ' · ' + sup.teachers.length + ' معلم'),
      closedBanner(),
      mkBtn('btn', '＋ إضافة معلم جديد', function () { supStart(null); }, { id: 'sup-add', disabled: S.closed }),
      h('div', { style: 'height:10px' }), q, listEl);
  };

  VIEWS.supteacher = function () {
    var t = S.sup.t, rows = [];
    rows.push(kvRow('الاسم', t.full_name));
    rows.push(h('div', null, h('span', { class: 'k' }, 'الرقم المدني'), h('span', { class: 'v' }, h('span', { class: 'ltr' }, '••••••••••' + t.civil_last4))));
    rows.push(kvRow('كود المعلم', t.teacher_code ? h('span', { class: 'ltr', id: 'v-code' }, t.teacher_code) : 'غير مسجّل'));
    if (t.work_type) rows.push(kvRow('نوع العمل', wtLabel(t.work_type) || String(t.work_type)));
    if (t.job_title) rows.push(kvRow('الدرجة الوظيفية', t.job_title));
    if (t.is_home) {
      rows.push(kvRow('التليفون', t.phone, !t.phone));
      rows.push(kvRow('البريد الإلكتروني', t.email));
      rows.push(kvRow('المؤهل', t.qualification));
      rows.push(kvRow('التخصص', t.specialty));
    }
    var cl = (t.classes || []).map(function (c) { var k = S.sup.classes.filter(function (z) { return z.id === c.class_id; })[0]; return (k ? k.label : 'فصل غير معروف') + ' · ' + perLabel(c.periods); });
    rows.push(h('div', null, h('span', { class: 'k' }, 'الفصول'), h('span', { class: 'v' }, cl.length ? cl.map(function (x) { return h('div', null, x); }) : 'لا فصول مسندة')));
    if (cl.length) rows.push(kvRow('إجمالي الحصص', h('span', { id: 'v-total' }, String(supTotal(t)))));
    return h('div', { class: 'card' },
      suptop('بيانات المعلم', '‹ المعلمون', function () { go('supschool'); }),
      closedBanner(),
      t.is_home ? null : h('div', { class: 'note', id: 'visitor-note' }, 'هذا المعلم منتدب إلى مدرستك؛ مدرسته الأصلية في مدرسة أخرى. يمكنك تعديل فصوله في ' + S.sup.school.name + ' فقط.'),
      t.pending ? h('div', { class: 'note', id: 'pending-note' }, 'لديك طلب سابق لهذا المعلم قيد المراجعة. أي إرسال جديد يحلّ محله.') : null,
      t.teacher_pending ? h('div', { class: 'note', id: 'tpending-note' }, 'أرسل المعلم نفسه طلب تعديل قيد المراجعة.') : null,
      h('div', { class: 'kv' }, rows),
      t.is_home ? mkBtn('btn', 'تعديل بيانات المعلم', function () { supStart(t, 'person'); }, { id: 'sup-edit-person', disabled: S.closed }) : null,
      t.is_home ? h('div', { style: 'height:10px' }) : null,
      mkBtn(t.is_home ? 'btn2' : 'btn', 'إسناد / تعديل الفصول', function () { supStart(t, 'classes'); }, { id: 'sup-edit-classes', disabled: S.closed }));
  };

  function supStart(t, startKey) {
    var sch = S.sup.school;
    S.mode = t ? 'sup_edit' : 'sup_new'; S.sup.t = t; S.supVisitor = !!t && !t.is_home;
    S.school = { id: sch.id, name: sch.name, stage_key: sch.stage_key }; S.baseSchoolId = sch.id; S.stageKey = sch.stage_key;
    S.base = {}; S.person = {};
    PKEYS.forEach(function (k) { var v = t && t[k] != null ? String(t[k]) : ''; S.base[k] = v; S.person[k] = v; });
    if (!t) { S.person.work_type = ''; S.person.civil_id = ''; }
    S.lookup = t ? { teacher: { work_type: t.work_type } } : null;
    S.baseSel = new Map((t ? t.classes : []).map(function (x) { return [x.class_id, x.periods]; }));
    S.sel = new Map(S.baseSel);
    S.sstepKeys = S.supVisitor ? ['classes', 'review'] : ['person', 'classes', 'review'];
    S.sstep = Math.max(0, S.sstepKeys.indexOf(startKey || S.sstepKeys[0]));
    S.draft = t ? null : loadDraft(dkey());
    go('supflow');
  }

  VIEWS.supflow = function () {
    var keys = S.sstepKeys, key = keys[S.sstep], n = keys.length, isNew = S.mode === 'sup_new';
    var wrap = h('div', { class: 'card' });
    wrap.appendChild(suptop(isNew ? 'إضافة معلم جديد' : S.sup.t.full_name, '‹ إلغاء', function () { go(isNew ? 'supschool' : 'supteacher'); }));
    var steps = h('div', { class: 'steps' });
    for (var i = 0; i < n; i++) steps.appendChild(h('div', { class: 'st' + (i === S.sstep ? ' on' : i < S.sstep ? ' done' : ''), id: 'st' + (i + 1) }, i < S.sstep ? '✓' : String(i + 1)));
    wrap.appendChild(steps);
    wrap.appendChild(h('div', { class: 'stlabel', id: 'stlabel' }, SUP_T[key]));
    if (S.supVisitor && S.sstep === 0) wrap.appendChild(h('div', { class: 'note', id: 'visitor-note' }, 'هذا المعلم منتدب إلى مدرستك، فيمكنك تعديل فصوله في ' + S.school.name + ' فقط.'));
    if (S.closed) wrap.appendChild(closedBanner());
    if (S.draft && S.sstep === 0) {
      var d = S.draft;
      wrap.appendChild(h('div', { class: 'warn', id: 'draft-note' }, 'لديك مسودة غير مرسلة لمعلم جديد محفوظة على هذا الجهاز. ',
        h('button', { type: 'button', class: 'link', id: 'draft-restore', onclick: function () { restoreDraft(d); S.draft = null; S.sstep = Math.min(d.step || 0, n - 1); render(); } }, 'متابعة المسودة'), ' · ',
        h('button', { type: 'button', class: 'link', id: 'draft-drop', onclick: function () { dropDraft(dkey()); S.draft = null; render(); } }, 'تجاهلها')));
    }
    var body = h('div', { id: 'stepbody' }), box = errbox();
    wrap.appendChild(body); wrap.appendChild(box);
    var nav = h('div', { class: 'row' });
    if (S.sstep > 0) nav.appendChild(mkBtn('btn2', 'السابق', function () { S.sstep--; saveDraft(); render(); }, { id: 'btn-prev' }));
    if (S.sstep < n - 1) nav.appendChild(mkBtn('btn', 'التالي', async function () {
      hideErr(box); if (key !== 'person' || await stepOk(1, box)) { S.sstep++; saveDraft(); render(); }
    }, { id: 'btn-next' }));
    else nav.appendChild(mkBtn('btn-ok', 'إرسال للاعتماد', async function (ev) {
      hideErr(box);
      if (S.closed) { showErr(box, reasonMsg({ reason: 'closed' })); return; }
      var b = ev.currentTarget; btnBusy(b, true, 'جارٍ الإرسال...');
      try { await doSupSubmit(box); } catch (e) { showErr(box, errMsg(e)); }
      if (document.body.contains(b)) btnBusy(b, false);
    }, { id: 'btn-submit' }));
    wrap.appendChild(nav);
    if (isNew) wrap.appendChild(h('p', { class: 'sub', style: 'margin-top:12px;font-size:.8rem' }, 'تُحفظ المسودة تلقائيًا على هذا الجهاز.'));
    ({ person: renderStep1, classes: renderStep3, review: renderStep4 })[key](body, box);
    return wrap;
  };

  async function doSupSubmit(box) {
    if (S.busy) return; S.busy = true;
    try {
      var isNew = S.mode === 'sup_new', pl = buildPayload(false), person = S.supVisitor ? {} : pl.person;
      if (isNew) { person.work_type = S.person.work_type; person.civil_id = digits(S.person.civil_id); }
      var r = await rpc('teacher_portal_sup_submit', {
        p_civil: S.sup.auth.civil, p_phone: S.sup.auth.phone, p_code: S.sup.auth.code, p_kind: isNew ? 'new' : 'update',
        p_teacher_id: isNew ? null : S.sup.t.id, p_school_id: S.sup.school.id,
        p_payload: { person: person, classes: pl.classes } });
      if (!r || r.ok !== true) { r = r || {}; r.sup = true; showErr(box, reasonMsg(r)); return; }
      if (isNew) dropDraft(dkey());
      S.result = r; S.supName = isNew ? pv('full_name') : S.sup.t.full_name; go('supdone');
    } finally { S.busy = false; }
  }

  VIEWS.supdone = function () {
    var r = S.result || {}, box = errbox();
    return h('div', { class: 'card' }, h('div', { class: 'ok-screen' },
      h('div', { class: 'ok-ic' }, '✓'),
      h('h2', null, r.kind === 'new' ? 'تم إرسال طلب إضافة المعلم' : 'تم إرسال التعديلات'),
      h('p', null, (S.supName ? S.supName + ' — ' : '') + 'ستراجعها إدارة التوجيه وتظهر في البرنامج بعد اعتمادها.'),
      h('div', { class: 'refno', id: 'refno' }, r.ref || ''),
      box,
      mkBtn('btn', 'العودة لمعلمي المدرسة', async function (ev) {
        hideErr(box); var b = ev.currentTarget; btnBusy(b, true, 'لحظة...');
        try { await openSchool(S.sup.school.id); } catch (e) { showErr(box, errMsg(e)); btnBusy(b, false); }
      }, { id: 'btn-back-school' }),
      h('div', { style: 'height:10px' }),
      mkBtn('btn2', 'الرئيسية', goHome, { id: 'btn-home' })));
  };

  /* ---------- التشغيل ---------- */
  async function boot() {
    S.statusErr = false;
    try { S.status = await rpc('teacher_portal_status'); } catch (e) { S.statusErr = true; }
    if (S.view === 'launcher') render();
  }
  if (CFG.trial) document.getElementById('ribbon').appendChild(h('div', { class: 'ribbon' }, 'نسخة تجريبية — لا تُعتمد البيانات إلا بعد مراجعة الإدارة'));
  render();
  boot();
})();
</script>
</body>
</html>
