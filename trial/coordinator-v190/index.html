<!-- v190: وضع «داخل البرنامج» (?embed=1): يُخفى الشريط العلوي ورابط «‹ بوابة البيانات» فقط؛ بدونه الصفحة كما هي (البوابة والرابط المباشر بلا تغيير). -->
<!-- v189: وصف المعلم في قائمة «أسند إلى:» من الكشف: الثابت «متبقٍ N» أو «زيادة N» أو «مكتمل»، ومعلم الأجر «أجر · يدرّس N حصة» (كان الأجر ومن عليه زيادة يظهران «مكتمل»)؛ الترتيب: من له متبقٍّ ثم الأجر الأقل حصصًا ثم المكتمل ثم من عليه زيادة؛ لا تأكيد «تجاوز النصاب» لمعلم الأجر، ولمن عليه زيادة يذكر الزيادة الجديدة. عرض فقط. -->
<!-- v188: لمس فصل/مجموعة غير مسندة في «الفصول والمجموعات» يعرض في القائمة نفسها «أسند إلى:» بمعلمي المدرسة (الأصليون والمنتدبون إليها، بلا إجازة مجددة) مرتبين بالمتبقي من النصاب؛ لمس المعلم يُسند الفصل كاملًا بحصصه عبر assign_class_atomic كما زر «إسناد فصل» في بطاقة المعلم (مع تأكيد عند تجاوز النصاب). في الثانوي لكل مادة غير مسندة قائمتها. الفصل المسند بلا تغيير. بلا تعديل قاعدة بيانات. -->
<!-- v187: مربع البحث في القائمة الجانبية (نفسه) صار يبحث في المدارس والمعلمين معًا عبر كل مراحل المنسق: الاسم بأي ترتيب واختصارات ع/ث/ت أ، الرقم القومي كاملًا أو آخر 4 أرقام (يُعرض ••••1234)، والهاتف 01…؛ وكلمات «ناقص» و«غير مسند» و«بلا معلمين» (ومعها المرحلة). نتيجة من مرحلة أخرى تبدّل المرحلة، والمعلم يفتح مدرسته على تبويب «المعلمون» وبطاقته مميّزة. المصدر: ما تحمّله الصفحة أصلًا (+ الاسم والرقم القومي في قراءة المعلمين؛ وإسنادات/متطلبات الفصول تُقرأ فقط عند «غير مسند») بصلاحيات المنسق نفسها. بلا تعديل قاعدة بيانات. -->
<!-- v186: شاشة اختيار المرحلة أول الدخول (ابتدائي/إعدادي/ثانوي عام/ثانوي صناعي) لمن له أكثر من مرحلة؛ والمنسق الواحد المرحلة يدخل مباشرة. قاعدة البيانات: شيماء محمد فرج منسقة ابتدائي أيضًا؛ ومحمد معله منسق ابتدائي وإعدادي أيضًا (الاسترجاع: active=false للصفوف bda2167f، a3f0882f، df70394d في stage_coordinator_assignments). -->
<!-- v185: فصول المعلم المسندة (بطاقته وتعديل بياناته، كل المراحل) بمربعات مجمّعة حسب الصف بدل الأسطر الطويلة: الرقم كبيرًا وتحته الحصص (والنوع/المادة في الثانوي)، وفصول المدارس الأخرى بلون مختلف تحت اسم مدرستها؛ لمس المربع ← قائمة سفلية بالتفاصيل و«إلغاء الإسناد» (حُذفت «×» منعًا للإلغاء بالخطأ). بلا تعديل قاعدة بيانات. -->
<!-- v184: فصول الإعدادي والابتدائي بشكل الثانوي (بطلب المستخدم «نفذ ١»): بطاقة لكل صف بمربعات أرقام الفصول (المسند أخضر باسم المعلم، غير المسند برتقالي أولًا)، سطر «N مسند · M ينتظر الإسناد»، «+ إضافة فصل» يملأ أصغر رقم ناقص، لمس الفصل: المعلم وإلغاء الإسناد أو حذف الفصل بعينه، و«تحديد» لحذف عدة فصول؛ حُذف «−» والجدول القديم. بلا تعديل قاعدة بيانات. -->
<!-- v183: اسم الحساب ظاهر دائمًا في الشريط العلوي على الهاتف (كان مخفيًا على الهاتف): الشريط سطران على الهاتف — الشعار والعنوان، ثم شارة الاسم («…» إن طال، وكاملًا في التلميح) مع «البرنامج» و«خروج»، كي لا يلتبس الحساب (بلاغ دخول بحساب آخر محفوظ في المتصفح). -->
<!-- v182: الاسم الجديد «إدخال بيانات المدارس» (بقرار المستخدم بدل «صفحة المنسق»/«إدخال بيانات المنسق» لأنه يلتبس بدور «منسق المرحلة» في البرنامج): عنوان التبويب والشريط العلوي وشاشة الدخول. -->
<!-- v181: زر «🖥 البرنامج» في الشريط العلوي يفتح البرنامج الرئيسي: على نطاق البوابة /app/ (نفس تسجيل الدخول)، وعلى github.io رابط البرنامج المنشور. -->
<!-- v180: شكل المجموعات الثانوية (بطلب المستخدم «نفذ من ١ إلى ٧»): (1) مربعات بالرقم فقط ظاهرة دائمًا بدل «النوع — مجموعة N» المطوية؛ (2) غير المسندة أولًا بإطار برتقالي متقطع والمسندة خضراء؛ (3) لمس المجموعة يفتح قائمة من أسفل الشاشة (تغيير النوع/حذف، أو للمسندة: معلمها وإلغاء الإسناد)؛ (4) اسم المعلم المختصر على المسندة؛ (5) «تحديد» في رأس الصف لتحويل أو حذف عدة مجموعات غير مسندة معًا؛ (6) «16 مسندة · 2 تنتظر الإسناد» وعنوان مختصر؛ (7) حُذف «−» من العدّاد (الحذف لمجموعة بعينها). بلا تعديل قاعدة بيانات. -->
<!-- v179: إدارة المجموعات الثانوية بلا رجوع للمطور — لكل مجموعة غير مسندة «تغيير النوع» (يُعاد تسميتها «النوع — مجموعة N» وتُضبط موادها وحصصها حسب النوع) و«حذف» لها بعينها؛ و«تعليم مزدوج» للصف الثاني الصناعي (فيزياء حصة واحدة). للمنسق ضمن مرحلته ولمدير النظام. -->
<!-- v178: الثانوي العام والثانوي الصناعي مرحلتان مستقلتان (قاعدة البيانات v223): قائمة المرحلة تعرضهما منفصلتين، ونوع المدرسة الثانوية ثابت على مرحلتها، وكل فحوص «ثانوي» صارت للمرحلتين. -->
<!-- v177: الموجه الأول لا يدخل بوابة المنسق (عرض وتقارير فقط في البرنامج الرئيسي)؛ الدخول لمنسق المرحلة ومدير النظام. -->
<title>إدخال بيانات المدارس — v190</title>
<!-- v175: اسم الفصل في بطاقة المعلم وقوائم الإسناد يعرض الصف أولًا للمجموعات الثانوية («الأول — عام — مجموعة 1») لأن اسم المجموعة يتكرر في كل صف. عرض فقط. -->
<!-- v174: تحسين الشكل — تبويبات المدرسة (البيانات | الموجهون | الفصول والمجموعات | المعلمون) بأعداد ونواقص، عدّادات +/− لكل نوع مجموعة في الثانوي (شريط المسند والأسماء مطوية)، بطاقة معلم مضغوطة (النصاب والمحتسب والمتبقي والموجه المسؤول) والبيانات الشخصية مطوية، ومنع خروج البريد الطويل عن الإطار. لا تغيير في البيانات أو الصلاحيات أو منطق الحفظ. -->
<!-- v173: المرحلة الثانوية — (1) أربع قوائم لموجه الفيزياء والكيمياء والأحياء والعلوم المتكاملة يختارها المنسق (الصناعي: الفيزياء والكيمياء فقط)؛ (2) إضافة المجموعات بقائمة نوع (حسب الصف ونوع المدرسة) بحصص جاهزة وحذف مجموعة غير مسندة بقائمة؛ (3) «الموجه المسؤول» عن المعلم بقائمة في تعديل بيانات المعلم (جدول teacher_responsible_supervisor) ويظهر في بطاقته؛ (4) إلغاء إسناد فصول المعلم وإسناد المتاح من داخل تعديل بياناته. -->
<!-- v172.5: المدرسة الصناعية لا تعرض سطر «غير مسند» لموجه الأحياء ولا تُعدّ ناقصة به. -->
<!-- v172.4: موجهو المرحلة الثانوية (العامة والصناعية) للعرض فقط في هذه الصفحة؛ لا تعديل لهم حتى للمنسق (يُسندون من الإدارة). -->
<!-- v172.3: المدرسة الثانوية بثلاثة موجهين حسب المادة (الفيزياء/الكيمياء/الأحياء) بدل موجه واحد؛ تُحفظ في supervisor_school_subjects (قاعدة v208). المراحل الأخرى كما هي. -->
<!-- v172.2: اسم الفصل يُعرض «الصف 3 · فصل 1» بدل «3/1» (كان يُقرأ معكوسًا)، وزر «×» على الفصل المسند صار زرًا نصيًا «إلغاء الإسناد» (كان يُفهم علامة خطأ). عرض فقط؛ أسماء الفصول في القاعدة بلا تغيير. -->
<!-- v172.1: الصفحة تعمل أيضًا داخل بوابة بيانات المعلمين (teachers-data-portal.vercel.app/coordinator/ عبر rewrite): روابط الشعار مطلقة، رابط «‹ بوابة البيانات» خارج GitHub، وتسجيل service worker على GitHub فقط. -->
<!-- v172: المرحلة 3 — إسناد الفصول من بطاقة المعلم (assign_class_atomic: الفصل كاملًا بحصصه المقررة) والتراجع (حذف مباشر تمنعه سياسة القاعدة بعد الاعتماد النهائي)؛ لا إسناد لمن في إجازة؛ تنبيه عند تجاوز النصاب (يُحتسب زيادة). -->
<!-- v171: المرحلة 2 — بطاقات المعلمين لكل مدرسة (من get_school_teacher_roster): كل البيانات والنصاب والفصول المسندة، التعديل (save_teacher_record_atomic + الحقول الإضافية)، وإضافة معلم ناقص (insert + teacher_school_assignments). تاريخا الدرجة واستلام العمل يُدخلان عند الإضافة فقط (صلاحية العمود في القاعدة). حالة المدرسة تشمل نقص بيانات معلميها وتعديلهم بعد الاعتماد. -->
<!-- v170.1: الحساب الذي له دور مدير النظام يدخل به أولًا (حساب المالك له دور منسق بلا مدارس فكانت القائمة فارغة). -->
<!-- v170: رابط مستقل لمنسق المرحلة: دخول بالرقم القومي وكلمة المرور، قائمة مدارس المرحلة، بطاقة بيانات المدرسة (عرض/تعديل/اعتماد المنسق) مع إضافة/حذف الفصول. المرحلة 2: بطاقات المعلمين. -->

<style>
:root{
 --navy:#0f214d;--primary:#1f4274;--gold:#ce9e48;--gold-soft:#fbe599;
 --bg:#f3f5f9;--card:#fff;--ink:#16213a;--muted:#5d6b85;--line:#dfe4ee;
 --ok:#1f7a4d;--ok-bg:#e5f4ec;--warn:#9a6a10;--warn-bg:#fdf3dc;--bad:#b3261e;--bad-bg:#fbe9e7;--info:#1f4274;--info-bg:#e8eef8;
 --radius:12px;--ctl-h:42px;--ctl-font:15px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:var(--ctl-font)}
.hidden{display:none!important}
.btn{height:var(--ctl-h);padding:0 16px;border-radius:10px;border:1px solid var(--primary);background:#fff;color:var(--primary);font-weight:700;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--primary);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.sm{height:34px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
input,select{height:var(--ctl-h);width:100%;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
input[readonly]{background:#f2f4f8;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:700}
.field{margin-bottom:12px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}
.notice{padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.7}
.n-info{background:var(--info-bg);color:var(--info)}.n-warn{background:var(--warn-bg);color:var(--warn)}.n-bad{background:var(--bad-bg);color:var(--bad)}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--navy),var(--primary))}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.login-card img{width:72px;height:72px;display:block;margin:0 auto 8px}
.login-card h1{font-size:19px;text-align:center;margin:0 0 4px;color:var(--navy)}
.login-card p{text-align:center;color:var(--muted);margin:0 0 18px;font-size:14px}
.login-card .btn{width:100%;margin-top:6px}
.portal-back{display:inline-block;color:var(--primary);text-decoration:none;font-size:14px;margin-bottom:8px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px;text-align:center}

/* shell */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.topbar img{width:36px;height:36px}
.topbar .t{flex:1;min-width:0}
.topbar b{display:block;font-size:15px}
.topbar small{display:block;color:var(--gold-soft);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .btn{height:34px;border-color:rgba(255,255,255,.4);background:transparent;color:#fff}
.topbar a.btn{display:inline-flex;align-items:center;text-decoration:none;font-size:14px}
.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);position:sticky;top:72px;max-height:calc(100vh - 88px);display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:12px;border-bottom:1px solid var(--line)}
.progress{font-size:13px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:#e9edf4;border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{height:30px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.slist{overflow:auto;flex:1}
.sitem{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid #eef1f6;cursor:pointer;width:100%;text-align:right;background:none;border-inline:0;border-top:0;color:inherit}
.sitem:hover{background:#f7f9fc}
.sitem.on{background:var(--info-bg);box-shadow:inset -4px 0 0 var(--gold)}
.sitem .nm{flex:1;min-width:0}
.sitem .nm b{display:block;font-size:14px}
.sitem .nm small{color:var(--muted);font-size:12px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2{flex:1;margin:0;font-size:18px;color:var(--navy);min-width:180px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv div{background:#f7f9fc;border-radius:10px;padding:9px 11px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:15px}
.kv .miss{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 12px}
h3{font-size:15px;margin:16px 0 8px;color:var(--navy)}
table.cls{width:100%;border-collapse:collapse}
table.cls th{background:var(--navy);color:#fff;font-size:13px;padding:8px;text-align:right}
table.cls td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper .btn{width:36px;padding:0;height:34px;font-size:18px}
.stepper b{min-width:28px;text-align:center;font-size:17px}
.names{display:flex;flex-wrap:wrap;gap:4px}
.names span{font-size:12px;background:#eef2f8;border-radius:6px;padding:2px 6px}
.names span.as{background:var(--ok-bg);color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.back{display:none}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.tcard.bad{border-color:#f0c4c0;box-shadow:inset -4px 0 0 var(--bad)}
.tcard.ed{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.thead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.thead b{font-size:16px;color:var(--navy);margin-inline-end:auto}
.tcard .kv div{padding:7px 10px}
.tcard .kv b{font-size:14px}
.tcls{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tcls span{font-size:13px;background:var(--info-bg);color:var(--info);border-radius:8px;padding:3px 8px}
.tcls span.ext{background:var(--warn-bg);color:var(--warn)}
.tcls .x{border:1px solid var(--bad);background:#fff;color:var(--bad);font-weight:700;cursor:pointer;padding:1px 8px;margin-inline-start:6px;font-size:12px;line-height:1.6;border-radius:6px;font-family:inherit}
.assign-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.assign-row select{flex:1;min-width:200px}
.sub{font-size:12px;color:var(--muted);font-weight:400}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;z-index:50;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:800px){
 .layout{grid-template-columns:1fr;padding:12px 16px}
 .side{position:static;max-height:none}
 body.detail .side{display:none}
 body:not(.detail) .main{display:none}
 .back{display:inline-block;margin-bottom:10px}
 :root{--ctl-h:44px}
 .actions .btn{flex:1}
 .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
 .kv b{font-size:14px;overflow-wrap:anywhere}

 });

  ${isNew?f('civil_id','الرقم القومي *','','inputmode="numeric" required placeholder="14 رقمًا"'):f('civil_x','الرقم القومي',t.civil_id,'readonly title="لا يتغير بعد الإنشاء"')}
  ${f('full_name','الاسم الكامل *',t.full_name,'required')}
  <div class="field"><label for="t_work_type">نوع العمل</label><select id="t_work_type" name="work_type"><option value="permanent" ${t.work_type==='permanent'?'selected':''}>ثابت</option><option value="paid" ${t.work_type==='paid'?'selected':''}>بالأجر</option></select></div>
  <div class="field"><label for="t_job_title">الدرجة الوظيفية</label><select id="t_job_title" name="job_title"><option value="">— اختر —</option>${jobs.map(j=>`<option ${t.job_title===j?'selected':''}>${esc(j)}</option>`).join('')}</select></div>
  ${f('appointment_date','تاريخ التعيين',t.appointment_date,'type="date"')}
  ${f('phone','الهاتف',t.phone,'inputmode="tel"')}
  ${f('qualification','المؤهل',t.qualification,'maxlength="160"')}
  ${f('qualification_year','سنة المؤهل',t.qualification_year,'inputmode="numeric" maxlength="4"')}
  ${f('specialty','التخصص',t.specialty,'maxlength="120"')}
  ${f('teacher_code','كود المعلم',t.teacher_code,'maxlength="40"')}
  ${f('residence','محل الإقامة',t.residence,'maxlength="160"')}
  ${f('email','البريد الإلكتروني',t.email,'type="email"')}
  ${isSec(s)?`<div class="field"><label for="t_resp">الموجه المسؤول عن المعلم</label><select id="t_resp" name="resp_sup"><option value="">— بدون —</option>${secSupOpts([S.trs[t.id]]).map(x=>`<option value="${x.id}" ${x.id===S.trs[t.id]?'selected':''}>${esc(x.full_name)}</option>`).join('')}</select></div>`:''}
  ${isNew?f('work_start_date','تاريخ استلام العمل','','type="date"')+f('grade_acquired_date','تاريخ الحصول على الدرجة','','type="date"')
   :f('ws_x','تاريخ استلام العمل',t.work_start_date||'—','readonly title="يعدّله مدير النظام"')+f('gd_x','تاريخ الحصول على الدرجة',t.grade_acquired_date||'—','readonly title="يعدّله مدير النظام"')}
  ${isNew?'':`<div class="field"><label for="t_home">المدرسة الأصلية (للنقل)</label><select id="t_home" name="home_school_id">${same.map(x=>`<option value="${x.id}" ${x.id===t.home_school_id?'selected':''}>${esc(x.name)}</option>`).join('')}${same.some(x=>x.id===t.home_school_id)?'':`<option value="${t.home_school_id||''}" selected>${esc(schoolName(t.home_school_id))}</option>`}</select></div>`}
 </div>
 ${isNew?'':(()=>{const tid=t.id,r=(S.roster||[]).find(x=>(x.teacher_id||x.id)===tid),cls=(S.tassign[tid]||[]).slice().sort((a,b)=>String(a.school_classes?.class_name).localeCompare(String(b.school_classes?.class_name),'ar',{numeric:true}));
  return `<div class="notice n-info" style="font-size:13px;margin-bottom:8px">احفظ التعديلات أعلاه أولًا قبل إسناد أو إلغاء إسناد فصل، لأن الشاشة تُحدَّث بعدهما.</div>
  <div style="margin-bottom:8px"><span class="sub">الفصول المسندة:</span>${teacherClassChips(s,cls)}</div>
  ${r&&!r.on_renewed_leave?assignRow(s,r):''}`})()}
 ${isNew?'':'<div class="notice n-info" style="font-size:13px">تاريخ استلام العمل وتاريخ الحصول على الدرجة يُدخلان عند إضافة المعلم فقط، وبعدها يعدّلهما مدير النظام.</div>'}
 <div class="actions"><button class="btn primary" id="tSave">${isNew?'إضافة المعلم':'حفظ بيانات المعلم'}</button><button type="button" class="btn ghost" id="tCancel">إلغاء</button></div></form>`;
}
function wireTeachers(s){
 const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
 on('tReload',()=>{S.roster=null;renderMain();loadTeachers(s.id)});
 on('tNew',()=>{S.tEdit='new';renderMain();$('t_civil_id')?.focus()});
 on('tMissOnly',()=>{S.tMissOnly=!S.tMissOnly;renderMain()});
 on('tCancel',()=>{S.tEdit=null;renderMain()});
 document.querySelectorAll('[data-tassign]').forEach(b=>b.onclick=()=>{S.tAssign=b.dataset.tassign;renderMain()});
 document.querySelectorAll('[data-tcls]').forEach(b=>b.onclick=()=>assignSheet(s,b.dataset.tcls));
 on('aCancel',()=>{S.tAssign=null;renderMain()});
 const go=$('aGo');if(go)go.onclick=()=>assignClass(s,go);
 document.querySelectorAll('[data-tedit]').forEach(b=>b.onclick=()=>{S.tEdit=b.dataset.tedit;renderMain();$('teacherForm')?.scrollIntoView({block:'start'})});
 const form=$('teacherForm');if(form)form.onsubmit=e=>{e.preventDefault();saveTeacher(s,form)};
}
function saveTeacher(s,form){
 const g=n=>{const el=form.elements.namedItem(n);return el?String(el.value||'').trim():''},isNew=!form.dataset.id;
 const d={full_name:g('full_name'),work_type:g('work_type')||'permanent',job_title:g('job_title')||null,appointment_date:g('appointment_date')||null,phone:digits(g('phone'))||null,
  qualification:g('qualification')||null,specialty:g('specialty')||null,teacher_code:g('teacher_code')||null,residence:g('residence')||null,email:g('email')||null};
 const yr=digits(g('qualification_year'));d.qualification_year=yr?Number(yr):null;
 if(!d.full_name)return toast('اسم المعلم مطلوب',true);
 if(d.qualification_year!==null&&!(d.qualification_year>=1950&&d.qualification_year<=2100))return toast('سنة المؤهل غير صحيحة',true);
 if(d.work_type==='permanent'&&!d.job_title)return toast('اختر الدرجة الوظيفية للمعلم الثابت',true);
 guard(async()=>{
  let tid=form.dataset.id;
  if(isNew){
   const civil=digits(g('civil_id'));if(civil.length!==14)throw new Error('الرقم القومي يجب أن يكون 14 رقمًا');
   const row=await q(sb.from('teacher_records').insert({...d,civil_id:civil,home_school_id:s.id,is_senior_teacher:false,active:true,work_start_date:g('work_start_date')||null,grade_acquired_date:g('grade_acquired_date')||null}).select('id').single());
   tid=row.id;
   await q(sb.from('teacher_school_assignments').insert({teacher_id:tid,school_id:s.id,academic_year_id:S.year.id,term_id:S.term.id,is_home_school:true,active:true}));
   toast('أضيف المعلم إلى المدرسة');
  }else{
   const t=S.trec[tid];
   await q(sb.rpc('save_teacher_record_atomic',{p_teacher_id:tid,p_civil_id:null,p_full_name:d.full_name,p_phone:d.phone,p_email:d.email,p_job_title:d.job_title,p_appointment_date:d.appointment_date,p_work_type:d.work_type,p_home_school_id:g('home_school_id')||t.home_school_id,p_active:true,p_academic_year_id:S.year.id,p_term_id:S.term.id,p_expected_version:Number(t.row_version||1)}));
   const r=await q(sb.from('teacher_records').update({qualification:d.qualification,qualification_year:d.qualification_year,specialty:d.specialty,teacher_code:d.teacher_code,residence:d.residence}).eq('id',tid).select('id'));
   toast(r?.length?'تم حفظ بيانات المعلم':'حُفظت البيانات الأساسية فقط (السجل خارج صلاحيتك)',!r?.length);
  }
  if(isSec(s)&&form.elements.namedItem('resp_sup')){
   const want=g('resp_sup')||null,cur=S.trs[tid]||null;
   if(want!==cur){const u=await q(sb.from('teacher_responsible_supervisor').upsert({teacher_id:tid,supervisor_id:want},{onConflict:'teacher_id'}).select('teacher_id'));
    if(!u?.length)throw new Error('لم يُحفظ الموجه المسؤول (لا توجد صلاحية)');S.trs[tid]=want}
  }
  S.tEdit=null;
  const fresh=await q(sb.from('teacher_records').select(T_FIELDS).eq('id',tid).maybeSingle());
  if(fresh){const i=S.teachers.findIndex(x=>x.id===tid);if(i>=0)S.teachers[i]=fresh;else S.teachers.push(fresh)}
  await loadTeachers(s.id);
 },true);
}

/* ---------- الحفظ ---------- */
async function guard(fn,keepFormOnError){if(S.busy)return;S.busy=true;document.querySelectorAll('.main .btn').forEach(b=>b.disabled=true);let ok=false;try{await fn();ok=true}catch(e){toast(errText(e),true)}finally{S.busy=false;if(ok||!keepFormOnError){renderMain();renderList()}else document.querySelectorAll('.main .btn').forEach(b=>b.disabled=false)}}
function saveSchool(s){guard(async()=>{
 const patch={gender_type:$('f_gender').value||null,phone:digits($('f_phone').value)||null,address:$('f_addr').value.trim()||null};
 if($('f_sup'))patch.supervisor_id=$('f_sup').value||null;
 if($('f_type'))patch.school_type=$('f_type').value||null;
 if(isSec(s))await saveSubjectSups(s);
 const rows=await q(sb.from('schools').update(patch).eq('id',s.id).select('id,school_type,gender_type,address,phone,supervisor_id,updated_at'));
 if(!rows?.length)throw new Error('لم يُحفظ التعديل (لا توجد صلاحية على هذه المدرسة)');
 Object.assign(s,rows[0]);S.edit=false;toast('تم حفظ بيانات المدرسة');
},true)}
async function syncClassCount(s){const n=classesOf(s.id).length;try{const r=await q(sb.from('schools').update({class_count:n}).eq('id',s.id).select('class_count,updated_at'));if(r?.[0])Object.assign(s,r[0])}catch(e){}}
function addClass(s,grade){guard(async()=>{
 const num=(GRADES[s.stage]||[]).find(x=>x[0]===grade)?.[1];
 const list=classesOf(s.id).filter(c=>norm(c.grade)===norm(grade));
 const used=new Set(list.map(c=>c.class_name)),nums=new Set(list.map(c=>(String(c.class_name).match(/(\d+)\s*$/)||[])[1]).filter(Boolean).map(Number));
 let k=1;while(nums.has(k)||used.has(`${num}/${k}`))k++;  // v184: أصغر رقم فصل ناقص
 const row=await q(sb.from('school_classes').insert({school_id:s.id,academic_year_id:S.year.id,term_id:S.term.id,stage:s.stage,grade,class_name:`${num}/${k}`,science_periods:0}).select('id,school_id,grade,class_name,grade_order').single());
 S.classes.push(row);await syncClassCount(s);toast(`أضيف ${cn(row.class_name)}`);await loadTeachers(s.id);
})}
/* v185: فصول المعلم المسندة بمربعات مجمّعة حسب الصف + قائمة سفلية لكل إسناد */
const GRADE_RANK=['الاول','الثاني','الثالث','الرابع','الخامس','السادس'];
const gradeRank=g=>{const i=GRADE_RANK.indexOf(norm(g));return i<0?99:i};
const subjShort=x=>String(x||'').replace(/^ال/,'');
function teacherClassChips(s,cls){
 if(!cls.length)return '<div class="tchips"><span class="sub">لا فصول مسندة</span></div>';
 const bySchool=new Map();
 cls.forEach(a=>{const sid=a.school_classes?.school_id||s.id;if(!bySchool.has(sid))bySchool.set(sid,[]);bySchool.get(sid).push(a)});
 const order=[...bySchool.keys()].sort((x,y)=>(x===s.id?-1:y===s.id?1:0));
 return `<div class="tchips">${order.map(sid=>{
  const ext=sid!==s.id,list=bySchool.get(sid),grades=new Map();
  list.forEach(a=>{const g=a.school_classes?.grade||'—';if(!grades.has(g))grades.set(g,[]);grades.get(g).push(a)});
  const rows=[...grades.keys()].sort((x,y)=>gradeRank(x)-gradeRank(y)).map(g=>{
   const items=grades.get(g).sort((x,y)=>grpNo(x.school_classes||{})-grpNo(y.school_classes||{}));
   return `<div class="tgrp"><div class="gl">${esc(g)}</div><div class="chips">${items.map(a=>{
    const c=a.school_classes||{},no=grpNo(c),subj=a.curriculum_subjects?.subject_name,p=Number(a.weekly_periods||0),sec=!/^\d+\s*\/\s*\d+$/.test(String(c.class_name||'').trim());
    const dup=sec&&subj&&subjShort(kindOf(c))===subjShort(subj),line2=`${subj&&!dup&&!/^علوم$|^العلوم$/.test(subj)?esc(subjShort(subj))+' ':''}${p} ح`;
    return `<button type="button" class="chip ${ext?'ext':'as'}" data-tcls="${a.id}" title="${esc(cng(c))}${subj?' — '+esc(subj):''} • ${p} ح${ext?' — '+esc(schoolName(sid)):''}"><b>${no<1e6?no:'•'}</b>${sec?`<small>${esc(kindOf(c))}</small>`:''}<small>${line2}</small></button>`}).join('')}</div></div>`}).join('');
  return `${ext?`<div class="tsch">في ${esc(schoolName(sid))} (للعرض)</div>`:''}${rows}`}).join('')}</div>`;
}
function assignSheet(s,aid){
 const a=Object.values(S.tassign).flat().find(x=>x.id===aid);if(!a)return;
 const c=a.school_classes||{},ext=c.school_id&&c.school_id!==s.id,subj=a.curriculum_subjects?.subject_name||'العلوم',p=Number(a.weekly_periods||0);
 const tch=tName(a.teacher_id),label=cng(c);
 openSheet(`<div class="sh-h"><b>${esc(label||'—')}</b><small>${esc(subj)} · ${p} حصص · ${esc(tch)}${ext?' · '+esc(schoolName(c.school_id)):''}</small></div>
  ${ext?'<p class="sh-note">هذا الفصل في مدرسة أخرى؛ يُدار من مدرسته.</p><div class="sh-act"><button type="button" class="btn ghost" data-x>إغلاق</button></div>'
   :'<div class="sh-act"><button type="button" class="btn danger-o" data-un>إلغاء الإسناد</button><button type="button" class="btn ghost" data-x>إغلاق</button></div>'}`,bg=>{
  bg.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeSheet);
  bg.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{closeSheet();unassignClass(s,aid,label)});
 });
}
function approve(s){
 const miss=missingOf(s);
 if(miss.length&&!confirm(`البيانات ناقصة (${miss.join('، ')}). اعتماد رغم ذلك؟`))return;
 guard(async()=>{
  const r=await q(sb.from('coordinator_school_approvals').upsert({school_id:s.id,academic_year_id:S.year.id,approved_by:S.me.id,approved_role:activeRole},{onConflict:'school_id,academic_year_id'}).select('approved_at').single());
  S.approvals[s.id]=r.approved_at;
  try{
   const sub=await q(sb.rpc('coordinator_submit_school_for_approval',{p_school_id:s.id,p_academic_year_id:S.year.id,p_term_id:S.term.id}));
   toast(sub?.unchanged?'تم اعتماد بيانات المدرسة (الطلب موجود مسبقًا في مركز الاعتماد)':'تم اعتماد البيانات وإرسالها لمركز الاعتماد');
  }catch(e){toast('تم اعتماد البيانات، لكن تعذّر إرسالها لمركز الاعتماد: '+(e?.message||e))}
 });
}

sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')renderLogin()});
boot();
if(IN_GH&&'serviceWorker' in navigator)navigator.serviceWorker.register('../../service-worker.js').catch(()=>{});
